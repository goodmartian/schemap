<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Storefront schema</title>
<style>
  /* Страница без своего каркаса <html>/<head>/<body>: так её публикует claude.ai как артефакт, а для файла
     каркас добавляет build_diagram.py. Вид — по Linear: нейтральный фон, тонкие рамки, один шрифт без моноширного. */
  :root {
    --color-background: #f4f4f5;
    --color-surface: #ffffff;
    --color-panel: #ffffff;
    --color-border: #e2e2e5;
    --color-text: #1f2023;
    --color-text-muted: #6b6f76;
    --color-accent: #5e6ad2;
    --color-row-hover: #f0f0f2;
    --shadow-overlay: 0 4px 16px rgba(0, 0, 0, 0.08);
    --font: "Inter Variable", Inter, "SF Pro Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    /* скругления: 4 — внутри панели, 8 — панели и карточки, 12 — области; холст берёт эти же числа */
    --radius-inner: 4px;
    --radius-outer: 8px;
    --radius-area: 12px;
    --control-height: 32px;
    --icon-size: 16px;
    --search-width: 240px;
    --menu-width: 264px;
    --details-width: 360px;
    --tip-width: 320px;
    --minimap-width: 176px;
    --minimap-height: 112px;
    --bar-height: 42px;                /* высота панели с одним рядом кнопок: 32 + поля 4 + рамка 1 */
    /* panels keep 12 from the window edge, plus the phone's safe area (notch, home bar) where there is one */
    --edge-top: calc(var(--space-3) + env(safe-area-inset-top, 0px));
    --edge-right: calc(var(--space-3) + env(safe-area-inset-right, 0px));
    --edge-bottom: calc(var(--space-3) + env(safe-area-inset-bottom, 0px));
    --edge-left: calc(var(--space-3) + env(safe-area-inset-left, 0px));
  }
  /* dark theme: from the system setting unless the host forces light; and again for a host that forces dark
     (claude.ai artifacts set data-theme on the root element) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-background: #0f1011;
      --color-surface: #161718;
      --color-panel: #191a1b;
      --color-border: #2a2c31;
      --color-text: #f7f8f8;
      --color-text-muted: #8a8f98;
      --color-accent: #7170ff;
      --color-row-hover: #232326;
      --shadow-overlay: 0 4px 16px rgba(0, 0, 0, 0.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --color-background: #0f1011;
    --color-surface: #161718;
    --color-panel: #191a1b;
    --color-border: #2a2c31;
    --color-text: #f7f8f8;
    --color-text-muted: #8a8f98;
    --color-accent: #7170ff;
    --color-row-hover: #232326;
    --shadow-overlay: 0 4px 16px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--color-background);
    color: var(--color-text);
    font: 13px/20px var(--font);
    -webkit-font-smoothing: antialiased;
  }
  /* главный холст — на всё окно; у мини-карты свой холст и свои правила */
  #canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #canvas.over-table { cursor: pointer; }
  #canvas.panning { cursor: grabbing; }
  .panel {
    position: fixed;
    padding: var(--space-1);
    background: var(--color-panel);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-outer);
    box-shadow: var(--shadow-overlay);                /* панели лежат поверх холста */
  }
  #top-left { position: fixed; top: var(--edge-top); left: var(--edge-left); display: flex; align-items: flex-start; gap: var(--space-2); }
  #top-left .panel { position: static; }
  #diagram-panel, #status-panel, #mode-panel { max-width: var(--menu-width); }
  /* подсказка клавиши; шрифт тот же, без моноширного */
  .shortcut {
    flex: none; min-width: var(--icon-size); padding: 0 var(--space-1); border: 1px solid var(--color-border); border-radius: var(--radius-inner);
    font-size: 12px; line-height: 16px; text-align: center; color: var(--color-text-muted);
  }
  .search-row:focus-within .shortcut, .search-row:has(input:not(:placeholder-shown)) .shortcut { display: none; }
  @media (hover: none) { .shortcut { display: none; } }   /* на телефоне клавиатуры нет — подсказка лишняя */
  #search-panel { top: var(--edge-top); right: var(--edge-right); width: var(--search-width); }
  #zoom-panel { right: var(--edge-right); bottom: var(--edge-bottom); display: flex; gap: var(--space-1); }
  .control {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    height: var(--control-height);
    padding: 0 var(--space-2);
    border: 0;
    border-radius: var(--radius-inner);
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
  }
  /* Строка списка — на всю ширину и с подложкой под курсором. Кнопка на самой панели — по содержимому и меняет
     только цвет: панель с кнопками остаётся одним сплошным элементом. */
  li > .control, .trigger { width: 100%; }
  li > .control:hover, .control[aria-current] { background: var(--color-row-hover); }
  .square, .quiet { color: var(--color-text-muted); }
  .control:hover, .control:hover .chevron { color: var(--color-text); }
  .control:focus-visible { outline: 2px solid var(--color-accent); outline-offset: -2px; }
  .square { width: var(--control-height); justify-content: center; padding: 0; }
  /* у поиска фокус показывает вся панель: поле внутри своей рамки не рисует */
  #search-panel:focus-within { border-color: var(--color-accent); box-shadow: 0 0 0 1px var(--color-accent), var(--shadow-overlay); }
  /* мини-карта: вся диаграмма и рамка окна; нажатие переносит туда вид */
  #minimap-panel { left: var(--edge-left); bottom: var(--edge-bottom); }
  @media (max-height: 559px) { #minimap-panel { display: none; } }   /* в низком окне она закрывала бы таблицы */
  #minimap { display: block; width: var(--minimap-width); height: var(--minimap-height); border-radius: var(--radius-inner); cursor: pointer; touch-action: none; }
  .icon { flex: none; width: var(--icon-size); height: var(--icon-size); }
  .search-row { display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-2); color: var(--color-text-muted); }
  .search-row input { padding-left: 0; color: var(--color-text); }
  .secondary {
    flex: none; max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--color-text-muted); font-variant-numeric: tabular-nums;
  }
  .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chevron { flex: none; width: var(--icon-size); height: var(--icon-size); color: var(--color-text-muted); }
  ul { margin: var(--space-1) 0 0; padding: 0; list-style: none; }
  input {
    width: 100%;
    height: var(--control-height);
    padding: 0 var(--space-2);
    border: 0;
    border-radius: var(--radius-inner);
    background: none;
    color: inherit;
    font: inherit;
    outline: none;                                    /* фокус показывает панель вокруг поля (:focus-within), не само поле */
  }
  input::placeholder { color: var(--color-text-muted); }
  .empty { margin: 0; padding: 0 var(--space-2); line-height: var(--control-height); color: var(--color-text-muted); }
  /* Панель описания таблицы — боковая колонка, как свойства задачи в Linear: занимает правый край на всю высоту
     и сдвигает схему, а не ложится поверх неё. Поиск и масштаб уходят влево от колонки. В узком окне — снизу. */
  #details {
    top: 0;
    right: 0;
    bottom: 0;
    width: var(--details-width);
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) 0;
    border: 0;
    border-left: 1px solid var(--color-border);
    border-radius: 0;
    box-shadow: none;
  }
  @media (min-width: 720px) {
    /* открыта ли колонка — CSS читает с самой колонки (атрибут hidden), отдельного флага нет.
       У холста своя ширина в пикселях: «auto» её не растягивает, поэтому ширина задана явно. */
    body:has(#details:not([hidden])) #canvas { width: calc(100% - var(--details-width)); }
    body:has(#details:not([hidden])) :is(#search-panel, #zoom-panel) { right: calc(var(--details-width) + var(--space-3)); }
  }
  @media (max-width: 719px) {
    #details {
      top: auto; left: var(--edge-left); right: var(--edge-right); bottom: var(--edge-bottom); width: auto; max-height: 50%;
      padding: 0; border: 1px solid var(--color-border); border-radius: var(--radius-outer); box-shadow: var(--shadow-overlay);
    }
    /* в узком окне поиск — вторым рядом во всю ширину, чтобы не закрывал выбор диаграммы и статуса */
    #search-panel { top: calc(var(--edge-top) + var(--bar-height) + var(--space-2)); left: var(--edge-left); width: auto; }
    #top-left { right: var(--edge-right); }            /* панели делят ряд; длинные названия режутся многоточием */
    #top-left .panel { min-width: 0; }
    #minimap-panel { display: none; }                  /* на телефоне мини-карте нет места рядом с описанием */
  }
  #details-top { flex: none; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-1) var(--space-1) var(--space-4); }
  #details-top .square { flex: none; }
  #details-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--space-4) var(--space-3); overflow-wrap: anywhere; }
  h2 { flex: 1; min-width: 0; margin: 0; font-size: 15px; line-height: 24px; font-weight: 600; overflow-wrap: anywhere; }
  h3 { margin: var(--space-4) 0 var(--space-1); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--color-text-muted); }
  #details p { margin: 0; }
  #details ul { margin: 0; }
  .meta { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-1); color: var(--color-text-muted); }
  .muted { color: var(--color-text-muted); }
  .column { padding: var(--space-2) 0; }
  .column-head { display: flex; align-items: baseline; gap: var(--space-2); }
  .column-name { flex: 1; min-width: 0; font-weight: 500; }
  .column-name.key { font-weight: 600; }
  .column-type { flex: none; font-size: 12px; color: var(--color-text-muted); }
  .small { font-size: 12px; line-height: 16px; }
  .link {
    display: block;
    padding: 0;
    border: 0;
    background: none;
    color: var(--color-accent);
    font: inherit;
    text-align: left;
    overflow-wrap: anywhere;
    cursor: pointer;
  }
  .link:hover { text-decoration: underline; }
  .link:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  #details-incoming { margin: 0 calc(-1 * var(--space-2)); }
  /* подсказка столбца на холсте */
  #tip {
    position: fixed;
    max-width: var(--tip-width);
    padding: var(--space-2) var(--space-3);
    background: var(--color-panel);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-outer);
    box-shadow: var(--shadow-overlay);
    overflow-wrap: anywhere;
    pointer-events: none;
  }
  #tip-name { font-weight: 600; }
  #failure { position: fixed; inset: 0; display: grid; place-content: center; gap: var(--space-1); margin: 0; padding: var(--space-4); text-align: center; }
  #failure-reason { color: var(--color-text-muted); }
</style>
</head>
<body>
<canvas id="canvas" role="img" data-label="canvas"></canvas>

<div id="top-left">
<nav id="diagram-panel" class="panel" data-label="diagramMenu">
  <button id="menu-button" class="control trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu">
    <span id="menu-label" class="label"></span>
    <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <ul id="menu" hidden></ul>
</nav>
<nav id="status-panel" class="panel" data-label="statusMenu">
  <button id="status-button" class="control trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="status-menu">
    <span id="status-label" class="label"></span>
    <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <ul id="status-menu" hidden></ul>
</nav>
<nav id="mode-panel" class="panel" data-label="modeMenu">
  <button id="mode-button" class="control trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="mode-menu">
    <span id="mode-label" class="label"></span>
    <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <ul id="mode-menu" hidden></ul>
</nav>
</div>

<div id="minimap-panel" class="panel" hidden><canvas id="minimap" data-label="minimap"></canvas></div>

<div id="search-panel" class="panel" role="search">
  <div class="search-row">
    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.25 10.25L13 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input id="search" type="search" data-placeholder="search" data-label="searchLabel" aria-keyshortcuts="/ Meta+K Control+K" autocomplete="off" spellcheck="false">
    <kbd class="shortcut" aria-hidden="true">/</kbd>
  </div>
  <ul id="results" hidden></ul>
</div>

<div id="zoom-panel" class="panel" role="group" data-label="zoom">
  <button id="zoom-out" class="control square" type="button" data-label="zoomOut"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  <button id="zoom-in" class="control square" type="button" data-label="zoomIn"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9M8 3.5v9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  <button id="zoom-fit" class="control quiet" type="button" data-text="fit"></button>
</div>

<aside id="details" class="panel" data-label="details" hidden>
  <div id="details-top">
    <h2 id="details-name"></h2>
    <button id="details-copy" class="control square" type="button" data-label="copyLink" data-title="copyLink"><svg id="copy-link" class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.75 9.25l2.5-2.5M7.25 4.75l1-1a2.48 2.48 0 013.5 3.5l-1 1M8.75 11.25l-1 1a2.48 2.48 0 01-3.5-3.5l1-1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><svg id="copy-done" class="icon" viewBox="0 0 16 16" aria-hidden="true" hidden><path d="M3.5 8.25l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="details-close" class="control square" type="button" data-label="close"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  </div>
  <div id="details-body">
    <p id="details-title"></p>
    <p id="details-note"></p>
    <p id="details-meta" class="meta"></p>
    <h3 data-text="columns"></h3>
    <ul id="details-columns"></ul>
    <h3 id="details-incoming-title" data-text="incoming"></h3>
    <ul id="details-incoming"></ul>
  </div>
</aside>

<div id="tip" role="tooltip" hidden><div id="tip-name"></div><div id="tip-note"></div></div>

<p id="failure" hidden><span id="failure-text"></span><span id="failure-reason"></span></p>

// Меряем тем же размером, каким рисуем: у системного шрифта ширина букв не растёт ровно с размером.
const widthCache = new Map();
function textWidth(text, weight, size) {
  const key = weight + '|' + size + '|' + text;

// Сколько первых знаков текста помещается в room (с многоточием, если не целиком): widthOf(k) — ширина первых

function longestFit(length, widthOf, ellipsis, room) {
  if (widthOf(length) <= room) return length;
  let low = 0, high = length - 1;
  while (low < high) {
    const middle = (low + high + 1) >> 1;
    if (widthOf(middle) + ellipsis <= room) low = middle; else high = middle - 1;

  const widthOf = (k) => textWidth(text.slice(0, k), weight, size);

// ---------- подготовка диаграммы: всё, что не зависит от масштаба, считается один раз ----------

    if (t.module !== null && !MODULES.has(t.module)) throw new Error(`table ${t.name}: unknown module`);

const buckets = { table: [], title: [], status: [], name: [], nameBold: [], mark: [], type: [] };
const BUCKET_STYLE = {
  table: [600, FONT.table, 'text', 'left'], title: [400, FONT.title, 'muted', 'left'],
  status: [600, FONT.status, 'muted', 'right'], name: [400, FONT.column, 'text', 'left'],
  nameBold: [600, FONT.column, 'text', 'left'], mark: [600, FONT.mark, 'muted', 'left'],
  type: [400, FONT.type, 'muted', 'right'],
};
const visible = [], dimmed = [], bright = [];       // карточки в окне; при выборе — приглушённые и яркие
const placed = [];                                    // уже нарисованные подписи областей: x, y, ширина

// Привязка к пикселям устройства: края прямоугольников и строки текста встают на целый пиксель — так резче
// и дешевле рисовать. frame задаётся в начале каждого кадра.
// Скругления кадра в единицах диаграммы: на экране как --radius-*, а когда всё мелкое — мельче вместе с масштабом.
const frame = { scale: 1, originX: 0, originY: 0, stroke: 0, cardRadius: 0, areaRadius: 0 };
const snap = (value) => Math.round(value * frame.scale) / frame.scale;
// скруглённый прямоугольник; в браузерах без roundRect — прямой
const roundedIn = (c, x, y, w, h, r) => (c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h));
const rounded = (x, y, w, h, r) => roundedIn(ctx, x, y, w, h, r);
const shape = (x, y, w, h) => rounded(x, y, w, h, frame.cardRadius);
function visibleRows(t, y0, y1) {                     // первая и последняя строка карточки, что попадают в окно по высоте
  const { head, row } = CARD;
  return [Math.max(0, Math.floor((y0 - t.y - head) / row)), Math.min(t.rows.length - 1, Math.floor((y1 - t.y - head) / row))];
}

function drawCards(diagram, group, alpha, level, y0, y1) {
  if (group.length === 0) return;
  const { width: W, head: HEAD, row: ROW } = CARD;
  const { zoom, dpr } = view;
  const tables = diagram.tables;
  const shift = frame.stroke;
  ctx.globalAlpha = alpha;

  if (level === 0) {                                  // приглушённый цветной прямоугольник: светлый цвет модуля поверх фона карточки
    ctx.fillStyle = theme.surface;
    ctx.beginPath();
    for (const i of group) { const t = tables[i]; ctx.rect(t.sx, t.sy, t.sw, t.sh); }
    ctx.fill();
    ctx.globalAlpha = alpha * 0.55;
    for (const [color, list] of byColor(tables, group)) {
      ctx.fillStyle = color;
      ctx.beginPath();
      for (const i of list) { const t = tables[i]; ctx.rect(t.sx, t.sy, t.sw, t.sh); }
      ctx.fill();
    }
    return;
  }

  ctx.fillStyle = theme.surface;                      // тело
  ctx.beginPath();
  for (const i of group) { const t = tables[i]; shape(t.sx, t.sy, t.sw, t.sh); }
  ctx.fill();
  ctx.strokeStyle = theme.border;                     // рамка и линия под шапкой — одним путём
  ctx.lineWidth = 1 / zoom;
  ctx.beginPath();
  for (const i of group) {
    const t = tables[i];
    shape(t.sx + shift, t.sy + shift, t.sw, t.sh);
    if (t.h > HEAD) {
      const y = snap(t.y + HEAD) + shift;
      ctx.moveTo(t.sx, y); ctx.lineTo(t.sx + t.sw, y);
    }
  }
  ctx.stroke();

  const padLeft = snap(PAD_X);
  if (level === 2) {                                  // полоски вместо строк
    ctx.fillStyle = theme.muted;
    ctx.globalAlpha = alpha * 0.4;
    ctx.beginPath();
    const barH = Math.max(1, Math.round(ROW * 0.3 * frame.scale)) / frame.scale;
    for (const i of group) {
      const t = tables[i];
      const [first, last] = visibleRows(t, y0, y1);
      for (let r = first; r <= last; r++) {
        const row = t.rows[r];
        const y = snap(t.y + HEAD + (r + 0.5) * ROW - barH / 2);
        const typeBar = snap(row.typeBar);
        ctx.rect(t.sx + padLeft, y, snap(row.nameBar), barH);
        ctx.rect(t.sx + t.sw - padLeft - typeBar, y, typeBar, barH);
      }
    }
    ctx.fill();
    ctx.globalAlpha = alpha;
  }

  if (level === 1 || level === 2) {                   // имя в шапке — постоянного размера на экране
    if (W * zoom < NAME_MIN_CARD_PX) return;
    const ellipsis = textWidth('…', 600, SMALL_NAME_PX);
    const room = Math.floor((W - 2 * PAD_X) * zoom);
    const padPx = Math.round(PAD_X * zoom * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const headY = (t) => Math.round((t.sy + Math.min(HEAD, t.h) / 2) * frame.scale + frame.originY) / dpr;
    const left = (t) => (t.sx * frame.scale + frame.originX + padPx) / dpr;
    ctx.font = `600 ${SMALL_NAME_PX}px ${FONT_FAMILY}`;
    ctx.fillStyle = theme.text;
    ctx.textAlign = 'left';
    for (const i of group) {
      const t = tables[i];
      if (t.smallRoom !== room) {                     // обрезка считается заново, только когда изменилась ширина
        t.smallRoom = room;
        t.smallText = cut(t.name, longestFit(t.name.length, (k) => t.smallPrefix[k], ellipsis, room));
      }
      ctx.fillText(t.smallText, left(t), headY(t));
    }
    ctx.setTransform(frame.scale, 0, 0, frame.scale, frame.originX, frame.originY);
    return;
  }

  for (const key in buckets) buckets[key].length = 0; // строки с текстом
  const nameLeft = snap(PAD_X + MARK_W);
  const nameY = (t) => snap(t.y + NAME_Y);
  for (const i of group) {
    const t = tables[i];
    const right = t.sx + t.sw - padLeft;
    if (t.y + HEAD > y0) {
      buckets.table.push(t.nameFit, t.sx + padLeft, nameY(t));
      if (t.statusText) buckets.status.push(t.statusText, right, nameY(t));
      buckets.title.push(t.titleFit, t.sx + padLeft, snap(t.y + TITLE_Y));
    }
    const [first, last] = visibleRows(t, y0, y1);
    for (let r = first; r <= last; r++) {
      const row = t.rows[r];
      const y = snap(t.y + HEAD + (r + 0.5) * ROW);
      (row.bold ? buckets.nameBold : buckets.name).push(row.name, t.sx + nameLeft, y);
      if (row.mark) buckets.mark.push(row.mark, t.sx + padLeft, y);
      buckets.type.push(row.type, right, y);
    }
  }
  for (const key in buckets) {
    const list = buckets[key];
    if (list.length === 0) continue;
    const [weight, size, color, align] = BUCKET_STYLE[key];
    ctx.font = `${weight} ${size}px ${FONT_FAMILY}`;
    ctx.fillStyle = theme[color];
    ctx.textAlign = align;
    for (let n = 0; n < list.length; n += 3) ctx.fillText(list[n], list[n + 1], list[n + 2]);
  }
}

// Подпись области под ширину room: название и число → без числа → название с многоточием → пусто.
function fitAreaLabel(area, room) {
  const widths = area.namePrefix, length = area.name.length;
  if (area.textWidth <= room) { area.label = area.text; area.labelWidth = area.textWidth; return; }
  if (widths[length] <= room) { area.label = area.name; area.labelWidth = widths[length]; return; }
  const ellipsis = textWidth('…', 600, AREA_FONT_PX);
  const kept = longestFit(length, (k) => widths[k], ellipsis, room);
  area.label = cut(area.name, kept);
  area.labelWidth = kept > 0 ? widths[kept] + ellipsis : 0;
}

function byColor(tables, group) {
  const map = new Map();
  for (const i of group) {
    const color = moduleColor(tables[i].module);
    if (!map.has(color)) map.set(color, []);
    map.get(color).push(i);
  }
  return map;
}

function traceEdge(e) {
  ctx.moveTo(e.sx, e.sy);
  ctx.bezierCurveTo(e.c1, e.sy, e.c2, e.ey, e.ex, e.ey);
}

// Концы подсвеченных связей: «много» — вилка у ссылающегося столбца, «один» — черта у столбца, на который
// ссылаются. Размер постоянный на экране (px — один пиксель экрана в единицах диаграммы).
function edgeEnds(diagram, list, px) {
  const fork = 8 * px, spread = 4 * px, bar = 8 * px;
  ctx.globalAlpha = 1;
  ctx.strokeStyle = theme.accent;
  ctx.lineWidth = 1.5 * px;
  ctx.beginPath();
  for (const index of list) {
    const e = diagram.edges[index];
    const tip = e.sx + e.sd * fork;                   // вилка: две линии от точки в промежутке к краю карточки
    ctx.moveTo(tip, e.sy); ctx.lineTo(e.sx, e.sy - spread);
    ctx.moveTo(tip, e.sy); ctx.lineTo(e.sx, e.sy + spread);
    const x = e.ex + e.ed * bar;                      // черта поперёк линии
    ctx.moveTo(x, e.ey - spread); ctx.lineTo(x, e.ey + spread);
  }
  ctx.stroke();
}

// ---------- мини-карта ----------
// Вся диаграмма в углу: области, карточки и рамка того, что сейчас в окне. Видна, только когда диаграмма
// не помещается в окно целиком; нажатие или протяжка переносит туда середину окна.
const minimapPanel = document.getElementById('minimap-panel');
const minimap = document.getElementById('minimap');
const mctx = minimap.getContext('2d');
const map = { scale: 1, ox: 0, oy: 0 };              // единицы диаграммы → пиксели мини-карты
const minimapLayer = document.createElement('canvas');   // неподвижная часть: области и карточки
let minimapKey = '', minimapShown = false;            // для чего слой нарисован; видна ли карта (CSS прячет её в тесном окне)
function drawMinimap(x0, y0, x1, y1) {
  const diagram = view.diagram;
  const [w, h] = diagram.size;
  const whole = x0 <= 0 && y0 <= 0 && x1 >= w && y1 >= h;
  if (minimapPanel.hidden !== whole) {
    minimapPanel.hidden = whole;
    minimapShown = !whole && minimap.clientWidth > 0;
  }
  if (!minimapShown) return;
  // Та же схема, что на холсте, в уменьшенном виде: полосы модулей со скруглением, приглушённые карточки,
  // поле 8 от края панели. Размеры — в пикселях мини-карты, поэтому делятся на её масштаб.
  const [cssW, cssH] = theme.minimap, dpr = view.dpr;
  map.scale = Math.min((cssW - 2 * MINIMAP_PAD) / w, (cssH - 2 * MINIMAP_PAD) / h);
  map.ox = (cssW - w * map.scale) / 2;
  map.oy = (cssH - h * map.scale) / 2;
  const px = 1 / map.scale;
  const key = [diagram.code, diagram.mode, theme.background, dpr].join('|');
  if (key !== minimapKey) {                           // слой рисуется заново, только когда он изменился
    minimapKey = key;
    minimap.width = minimapLayer.width = Math.round(cssW * dpr);
    minimap.height = minimapLayer.height = Math.round(cssH * dpr);
    const layer = minimapLayer.getContext('2d');
    layer.setTransform(dpr, 0, 0, dpr, 0, 0);
    layer.fillStyle = theme.panel;
    layer.fillRect(0, 0, cssW, cssH);
    layer.setTransform(dpr * map.scale, 0, 0, dpr * map.scale, dpr * map.ox, dpr * map.oy);
    layer.globalAlpha = 0.1;                          // полосы модулей, как на холсте
    for (const area of diagram.areas) {
      layer.fillStyle = moduleColor(area.module);
      layer.beginPath();
      roundedIn(layer, area.x, area.y, area.w, area.h, theme.radiusInner * px);
      layer.fill();
    }
    layer.globalAlpha = 0.55;                         // карточки приглушены, как на общем виде холста
    for (const [color, list] of byColor(diagram.tables, diagram.allIndexes)) {
      layer.fillStyle = color;
      layer.beginPath();
      for (const i of list) { const t = diagram.tables[i]; roundedIn(layer, t.x, t.y, CARD.width, t.h, 1.5 * px); }
      layer.fill();
    }
  }
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.globalAlpha = 1;
  mctx.drawImage(minimapLayer, 0, 0);
  mctx.setTransform(dpr * map.scale, 0, 0, dpr * map.scale, dpr * map.ox, dpr * map.oy);
  const vx = Math.max(0, x0), vy = Math.max(0, y0), vw = Math.min(w, x1) - vx, vh = Math.min(h, y1) - vy;
  mctx.beginPath();                                   // рамка окна: тонкая, скруглённая, как фокус у панелей
  roundedIn(mctx, vx, vy, vw, vh, theme.radiusInner * px);
  mctx.globalAlpha = 0.08;
  mctx.fillStyle = theme.accent;
  mctx.fill();
  mctx.globalAlpha = 1;
  mctx.strokeStyle = theme.accent;
  mctx.lineWidth = px;
  mctx.stroke();
}
let minimapDrag = null;                               // рамка мини-карты на экране, пока её тянут: меряется один раз
function minimapGo(event) {                           // середина окна — в точку мини-карты под указателем
  const x = (event.clientX - minimapDrag.left - map.ox) / map.scale;
  const y = (event.clientY - minimapDrag.top - map.oy) / map.scale;
  view.fitted = false;
  view.tx = view.width / 2 - x * view.zoom;
  view.ty = view.height / 2 - y * view.zoom;
  keepInView();
  requestDraw();
}
minimap.addEventListener('pointerdown', (event) => {
  if (event.button !== 0) return;
  minimapDrag = minimap.getBoundingClientRect();
  minimap.setPointerCapture(event.pointerId);
  gesture();
  minimapGo(event);
});
minimap.addEventListener('pointermove', (event) => { if (minimapDrag) { gesture(); minimapGo(event); } });
minimap.addEventListener('pointerup', () => { minimapDrag = null; });
minimap.addEventListener('pointercancel', () => { minimapDrag = null; });

function draw() {
  const { zoom, tx, ty, dpr, width, height, diagram } = view;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = theme.background;
  ctx.fillRect(0, 0, width, height);
  if (diagram) {
    const { width: W } = CARD;
    const x0 = -tx / zoom, y0 = -ty / zoom, x1 = (width - tx) / zoom, y1 = (height - ty) / zoom;
    const px = 1 / zoom;
    // приглушает остальное выбор таблицы или фильтр по статусу (выбор главнее); наведение — одна рамка
    const active = view.selected;
    const lit = active >= 0 ? diagram.tables[active].lit
      : view.status !== null ? diagram.byStatus[view.status].lit : null;
    frame.scale = dpr * zoom;
    frame.originX = Math.round(dpr * tx);
    frame.originY = Math.round(dpr * ty);
    frame.stroke = Math.round(dpr) % 2 ? 0.5 / frame.scale : 0;   // линия нечётной толщины встаёт на середину пикселя
    frame.cardRadius = Math.min(theme.radiusCard / zoom, theme.radiusCard);  // на экране min(8, 8 × масштаб)
    frame.areaRadius = Math.min(theme.radiusArea / zoom, theme.radiusArea);  // на экране min(12, 12 × масштаб)
    ctx.setTransform(frame.scale, 0, 0, frame.scale, frame.originX, frame.originY);
    ctx.textBaseline = 'middle';
    const outline = (t, widthPx, color) => {          // рамка вокруг карточки
      const x = snap(t.x), y = snap(t.y);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = color;
      ctx.lineWidth = widthPx * px;
      ctx.beginPath();
      shape(x, y, snap(t.x + W) - x, snap(t.y + t.h) - y);
      ctx.stroke();
    };

    // области — полосы-группы, как колонки доски в Linear: лёгкий оттенок модуля, скругление, без рамки
    ctx.globalAlpha = 0.07;
    for (const area of diagram.areas) {
      if (area.x > x1 || area.x + area.w < x0 || area.y > y1 || area.y + area.h < y0) continue;
      const x = snap(area.x), y = snap(area.y), w = snap(area.x + area.w) - x, h = snap(area.y + area.h) - y;
      ctx.fillStyle = moduleColor(area.module);
      ctx.beginPath();
      rounded(x, y, w, h, frame.areaRadius);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // в обзоре (диаграмма без своего модуля) связь между модулями видна только у выбранной таблицы:
    // 267 таких линий на общем виде сливались в клубок
    const crossHidden = diagram.module === null;
    ctx.beginPath();                                  // связи, не относящиеся к выбранной таблице
    for (const e of diagram.edges) {
      if (crossHidden && e.cross) continue;
      if (e.minX > x1 || e.maxX < x0 || e.minY > y1 || e.maxY < y0) continue;
      if (active >= 0 && (e.a === active || e.b === active)) continue;
      traceEdge(e);
    }
    ctx.strokeStyle = theme.muted;
    ctx.lineWidth = px;
    ctx.globalAlpha = lit ? 0.12 : 0.45;
    ctx.stroke();

    visible.length = 0;                               // карточки в окне
    diagram.tables.forEach((t, i) => {
      if (t.x > x1 || t.x + W < x0 || t.y > y1 || t.y + t.h < y0) return;
      visible.push(i);
      t.sx = snap(t.x); t.sy = snap(t.y);             // прямоугольник карточки на сетке пикселей — на этот кадр
      t.sw = snap(t.x + W) - t.sx; t.sh = snap(t.y + t.h) - t.sy;
    });
    // уровень детализации зависит только от масштаба: смена текста на полоски во время жеста выглядела как мигание
    const level = FONT.column * zoom >= TEXT_MIN_PX ? 3
      : CARD.row * zoom >= BARS_MIN_ROW_PX ? 2
      : W * zoom >= NAME_MIN_CARD_PX ? 1 : 0;
    const chosen = active >= 0 ? diagram.tables[active] : null;
    if (lit) {
      dimmed.length = bright.length = 0;               // одна проходка делит видимые карточки на приглушённые и яркие
      for (const i of visible) (lit[i] ? bright : dimmed).push(i);
      drawCards(diagram, dimmed, DIM_ALPHA, level, y0, y1);
      if (chosen) {                                   // связи выбранной таблицы — под ней и её соседями,
        ctx.globalAlpha = 1;                          // чтобы линия не шла по их тексту
        ctx.strokeStyle = theme.accent;
        ctx.lineWidth = 1.5 * px;
        ctx.beginPath();
        for (const index of chosen.edges) traceEdge(diagram.edges[index]);
        ctx.stroke();
      }
      drawCards(diagram, bright, 1, level, y0, y1);
      if (chosen) {
        edgeEnds(diagram, chosen.edges, px);
        outline(chosen, 2, theme.accent);
      }
    } else {
      drawCards(diagram, visible, 1, level, y0, y1);
    }
    // под курсором — только рамка; во время жеста её нет, чтобы не прыгала по карточкам
    if (view.hover >= 0 && view.hover !== active && !view.moving) outline(diagram.tables[view.hover], 1, theme.muted);
    // столбец под курсором (только когда строки с текстом): его строка, строки на других концах связей и сами связи
    const row = level === 3 && !view.moving ? view.hoverRow : null;
    if (row) {
      const list = diagram.tables[row.index].rowEdges[row.row];
      const tint = (index, r) => {
        const t = diagram.tables[index];
        ctx.fillRect(snap(t.x), snap(t.y + CARD.head + r * CARD.row), snap(t.x + W) - snap(t.x), snap(CARD.row));
      };
      ctx.globalAlpha = 0.12;
      ctx.fillStyle = theme.accent;
      tint(row.index, row.row);                       // строка под курсором — один раз, у связи — только другой конец
      for (const index of list) {
        const e = diagram.edges[index];
        if (e.a === row.index && e.ac === row.row) tint(e.b, e.bc); else tint(e.a, e.ac);
      }
      if (list.length > 0) {
        ctx.globalAlpha = 1;
        ctx.strokeStyle = theme.accent;
        ctx.lineWidth = 1.5 * px;
        ctx.beginPath();
        for (const index of list) traceEdge(diagram.edges[index]);
        ctx.stroke();
        edgeEnds(diagram, list, px);
      }
    }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);           // названия областей — в экранных пикселях
    ctx.globalAlpha = 1;
    ctx.font = `600 ${AREA_FONT_PX}px ${FONT_FAMILY}`;
    ctx.textAlign = 'left';
    placed.length = 0;
    // подпись внутри полосы, в её верхнем поле, когда поле не ниже подписи с отступами 4; иначе — над полосой
    const inside = CARD.areaTop * zoom >= LABEL_H + 8;
    const inset = inside ? Math.min(12, (CARD.areaTop * zoom - LABEL_H) / 2) : 0;
    // текст подписи — на одной линии с левым краем карточек, как заголовок колонки
    const insetX = inside ? Math.max(0, CARD.areaPad * zoom - LABEL_PAD) : 0;
    for (const area of diagram.areas) {
      const left = area.x * zoom + tx, right = (area.x + area.w) * zoom + tx;
      const top = area.y * zoom + ty, bottom = (area.y + area.h) * zoom + ty;
      if (left > width || right < 0 || top > height || bottom < 0) continue;
      if (right - left < AREA_LABEL_MIN_PX) continue;
      // подпись может занять и промежуток до соседней области (на три четверти), но не саму соседнюю область
      const room = Math.floor(right - left - insetX + CARD.areaGap * zoom * 0.75);
      if (area.labelRoom !== room) {                  // текст подбирается заново, только когда изменилась ширина
        area.labelRoom = room;
        fitAreaLabel(area, room - 2 * LABEL_PAD);
      }
      if (area.label === '') continue;
      const labelW = area.labelWidth + 2 * LABEL_PAD;
      // подпись держится у левого края области; когда область уехала влево — у края окна, пока хватает области
      const x = Math.round(Math.max(left + insetX, Math.min(12, right - labelW)));
      const home = inside ? top + inset : top - LABEL_H - 4;
      const y = Math.round(Math.min(Math.max(home, topInset), Math.max(home, bottom - LABEL_H - inset)));
      let clash = false;                              // две подписи не пересекаются: вторая тогда не рисуется
      for (let n = 0; n < placed.length; n += 3) {
        if (x < placed[n] + placed[n + 2] && x + labelW > placed[n] && Math.abs(y - placed[n + 1]) < LABEL_H) clash = true;
      }
      if (clash) continue;
      placed.push(x, y, labelW);
      // подложка закрывает линии связей под текстом и выглядит как то, на чём лежит: полоса или фон
      ctx.fillStyle = theme.background;
      ctx.fillRect(x, y, labelW, LABEL_H);
      if (inside && y + LABEL_H <= bottom) {
        ctx.globalAlpha = 0.07;
        ctx.fillStyle = moduleColor(area.module);
        ctx.fillRect(x, y, labelW, LABEL_H);
        ctx.globalAlpha = 1;
      }
      const middle = y + LABEL_H / 2 + 1;
      const textX = x + LABEL_PAD;
      const withCount = area.label === area.text;
      const name = withCount ? area.name : area.label;
      ctx.fillStyle = theme.text;
      ctx.fillText(name, textX, middle);
      if (withCount) {
        ctx.fillStyle = theme.muted;
        ctx.fillText(area.text.slice(area.name.length), textX + area.namePrefix[area.name.length], middle);
      }
    }
    drawMinimap(x0, y0, x1, y1);
  }
}

let drawQueued = false;
function requestDraw() {
  if (drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; draw(); });
}

// Жест — сдвиг или масштаб, пока события идут подряд. Во время жеста не рисуется рамка наведения;
// через GESTURE_REST_MS после последнего события карточка под курсором находится заново.
let gestureTimer = 0;
function gesture() {
  if (!view.moving) {
    view.moving = true;
    hideTip();
  }
  clearTimeout(gestureTimer);
  gestureTimer = setTimeout(() => {
    view.moving = false;
    view.hover = pointer.inside ? tableAt(pointer.x, pointer.y) : -1;   // под курсором после жеста — уже другая карточка
    canvas.classList.toggle('over-table', view.hover >= 0);
    if (pointer.inside) hoverAt(pointer.x, pointer.y, view.hover);
    requestDraw();
  }, GESTURE_REST_MS);
}
const pointer = { x: 0, y: 0, inside: false };        // последняя точка указателя над холстом

// ---------- вид: размер, масштаб, сдвиг ----------
function resize() {
  view.dpr = window.devicePixelRatio || 1;
  // холст — окно без боковой колонки описания, когда она открыта (её место CSS отдаёт ей, а не схеме)
  view.width = canvas.clientWidth;
  view.height = window.innerHeight;
  canvas.width = Math.round(view.width * view.dpr);
  canvas.height = Math.round(view.height * view.dpr);
  // ниже всех панелей сверху (в узком окне поиск стоит вторым рядом) и ещё отступ
  topInset = Math.max(topLeft.getBoundingClientRect().bottom, searchPanel.getBoundingClientRect().bottom) + 12;
  fitTop = topInset + LABEL_H + 4;                    // на общем виде над областями ещё строка их подписей
  minimapShown = !minimapPanel.hidden && minimap.clientWidth > 0;
  if (view.diagram && view.fitted) fit();            // пока вид не трогали, он остаётся «весь вид»
  else if (view.diagram) view.fitZoom = fitZoom();
  draw();
}
function fitZoom() {
  const [w, h] = view.diagram.size;
  return Math.min(1, (view.width - 2 * EDGE_INSET) / w, (view.height - fitTop - BOTTOM_INSET) / h);
}
function fit() {
  view.fitted = true;
  if (view.width <= 2 * EDGE_INSET || view.height <= fitTop + BOTTOM_INSET) return;   // окно ещё без размера
  const [w, h] = view.diagram.size;
  view.fitZoom = view.zoom = fitZoom();
  view.tx = (view.width - w * view.zoom) / 2;
  view.ty = fitTop + (view.height - fitTop - BOTTOM_INSET - h * view.zoom) / 2;
  requestDraw();
}
function keepInView() {                               // диаграмму нельзя увести за край окна целиком
  const [w, h] = view.diagram.size;
  const shownW = w * view.zoom, shownH = h * view.zoom;
  const keepX = Math.min(shownW * KEEP_IN_VIEW, view.width / 2), keepY = Math.min(shownH * KEEP_IN_VIEW, view.height / 2);
  view.tx = Math.min(view.width - keepX, Math.max(keepX - shownW, view.tx));
  view.ty = Math.min(view.height - keepY, Math.max(keepY - shownH, view.ty));
}
function pan(dx, dy) {
  view.fitted = false;
  view.tx += dx;
  view.ty += dy;
  keepInView();
  requestDraw();
}
function zoomAt(x, y, factor) {                       // масштаб к точке окна (x, y): она остаётся на месте
  const next = Math.min(ZOOM_MAX, Math.max(view.fitZoom * 0.5, view.zoom * factor));
  view.fitted = false;
  view.tx = x - (x - view.tx) * (next / view.zoom);
  view.ty = y - (y - view.ty) * (next / view.zoom);
  view.zoom = next;
  keepInView();
  requestDraw();
}
function tableAt(x, y) {
  if (!view.diagram) return -1;
  const wx = (x - view.tx) / view.zoom, wy = (y - view.ty) / view.zoom;
  const tables = view.diagram.tables;
  for (let i = tables.length - 1; i >= 0; i--) {
    const t = tables[i];
    if (wx >= t.x && wx <= t.x + CARD.width && wy >= t.y && wy <= t.y + t.h) return i;
  }
  return -1;
}
function showTable(index) {
  const t = view.diagram.tables[index];
  select(index);
  view.fitted = false;
  // свободное место: колонка описания справа уже вычтена из холста; в узком окне она лежит снизу поверх схемы
  const sheet = details.getBoundingClientRect().top > 0;
  const freeWidth = view.width;
  const freeHeight = view.height - (sheet ? details.offsetHeight + BOTTOM_INSET : 0);
  // масштаб, при котором столбцы читаются; высокая таблица встаёт верхом к верху окна
  view.zoom = Math.min(1, Math.max(READ_MIN_PX / FONT.column, (freeHeight - topInset - 2 * EDGE_INSET) / t.h));
  view.tx = freeWidth / 2 - (t.x + CARD.width / 2) * view.zoom;
  view.ty = topInset + (freeHeight - topInset) / 2 - (t.y + t.h / 2) * view.zoom;
  if (t.h * view.zoom > freeHeight - topInset - EDGE_INSET) view.ty = topInset + EDGE_INSET - t.y * view.zoom;
  requestDraw();
}

// ---------- выбор таблицы и панель описания ----------
const details = document.getElementById('details');
function select(index) {                              // выбор открывает панель описания, снятие выбора закрывает
  if (index === view.selected) return;
  view.selected = index;
  showDetails();
  writeAddress(false);
  requestDraw();
}

// ---------- адрес: «#диаграмма» или «#диаграмма--таблица» — ссылка открывает диаграмму сразу на таблице ----------
// Slugs are ASCII letters, digits and single hyphens (the build makes them): only such a plain #name survives
// a claude.ai artifact link, and «--» never occurs inside a slug, so it separates the two parts.
const ADDRESS_WRITABLE = location.protocol !== 'data:';   // у адреса data: менять «#…» браузер запрещает
function address() {
  const table = view.selected >= 0 ? TABLES[view.diagram.tables[view.selected].id] : null;
  return '#' + view.diagram.slug + (table ? '--' + table.slug : '');
}
function writeAddress(push) {                         // смена диаграммы — новый шаг истории, выбор таблицы — нет
  if (!ADDRESS_WRITABLE || location.hash === address()) return;
  if (push) history.pushState(null, '', address()); else history.replaceState(null, '', address());
}
function openAddress(hash) {
  const [diagramSlug, tableSlug] = hash.split('--');
  const diagram = DIAGRAMS_BY_SLUG.get(diagramSlug);
  openDiagram(diagram ? diagram.code : '');         // незнакомый адрес — первая диаграмма
  const index = tableSlug === undefined ? undefined : view.diagram.indexBySlug.get(tableSlug);
  if (index === undefined) select(-1); else showTable(index);   // незнакомая таблица — диаграмма без выбора
}

// ---------- ссылка на таблицу ----------
const copyButton = document.getElementById('details-copy');
// В адресе data: таблицы нет — копировать нечего; без доступа к буферу обмена кнопка не нужна.
// Inside a frame (a claude.ai artifact) the page's own address is not the link people open: Share → Copy link is.
copyButton.hidden = !ADDRESS_WRITABLE || !navigator.clipboard || window.self !== window.top;
let copyTimer = 0;
copyButton.addEventListener('click', () => {
  navigator.clipboard.writeText(location.href).then(() => {
    document.getElementById('copy-link').hidden = true;
    document.getElementById('copy-done').hidden = false;
    copyButton.setAttribute('aria-label', TEXT.copied);
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => {
      document.getElementById('copy-link').hidden = false;
      document.getElementById('copy-done').hidden = true;
      copyButton.setAttribute('aria-label', TEXT.copyLink);
    }, 1500);
  }).catch((error) => {                               // the browser refused: show the link on the button instead
    console.error('copy link:', error);
    copyButton.title = location.href;
  });
});

// ---------- меню выбора: статус таблиц и какие столбцы показать ----------
// Одна форма для обоих: панель с кнопкой (текущий выбор) и список вариантов, у варианта может быть число.
function picker(name, onPick) {
  const panel = document.getElementById(`${name}-panel`);
  const button = document.getElementById(`${name}-button`);
  const list = document.getElementById(`${name}-menu`);
  button.addEventListener('click', () => toggleMenu(button, list));
  return {
    close() { setMenuOpen(button, list, false); },
    // choices: [{ value, label, count }] (count — число или null); visible — показывать ли панель вообще
    show(choices, current, visible) {
      panel.hidden = !visible;
      document.getElementById(`${name}-label`).textContent = choices.find((c) => c.value === current).label;
      list.replaceChildren(...choices.map(({ value, label, count }) => {
        const row = listRow(make('button'), label, count);
        row.type = 'button';
        if (value === current) row.setAttribute('aria-current', 'true');
        row.addEventListener('click', () => { closeMenu(); onPick(value); });
        return listItem(row);
      }));
    },
  };
}

// статус: таблицы с выбранным статусом видны, остальные приглушены
const statusPicker = picker('status', (status) => { view.status = status; buildStatusMenu(); requestDraw(); });
function buildStatusMenu() {                          // пункты — только статусы, которые есть в этой диаграмме
  const counts = view.diagram.byStatus;
  const names = TEXT.statusFilter;
  const present = Object.keys(names).filter((status) => counts[status].count > 0);
  if (view.status !== null && !present.includes(view.status)) view.status = null;
  statusPicker.show([{ value: null, label: TEXT.allTables, count: null },
    ...present.map((status) => ({ value: status, label: names[status], count: counts[status].count }))],
  view.status, present.length >= 2);                  // один статус — фильтровать нечего
}

// столбцы: все или только ключи (первичный ключ и оба конца каждой связи) — у каждой диаграммы два вида
const modePicker = picker('mode', setMode);
function buildModeMenu() {
  modePicker.show([{ value: 'all', label: TEXT.modeAll, count: null },
    { value: 'keys', label: TEXT.modeKeys, count: null }], view.mode, true);
}
function setMode(mode) {                              // та же диаграмма в другом виде; выбранная таблица остаётся
  if (mode === view.mode) return;
  const selectedId = view.selected >= 0 ? view.diagram.tables[view.selected].id : null;
  view.mode = mode;
  buildModeMenu();
  openDiagram(view.diagram.code);
  if (selectedId !== null) showTable(view.diagram.indexById.get(selectedId));
}
function make(tag, className, text) {                 // узел страницы с классом и текстом
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function tableLink(id, text) {                        // кнопка-ссылка на другую таблицу
  const button = make('button', 'link', text);
  button.type = 'button';
  button.addEventListener('click', () => goToTable(id));
  return button;
}
function showDetails() {
  details.hidden = view.selected < 0;
  // колонка открылась или закрылась — CSS поменял ширину холста; вид остаётся на месте, слева
  if (canvas.clientWidth !== view.width) resize();
  if (details.hidden) return;
  const id = view.diagram.tables[view.selected].id;
  const table = TABLES[id];
  document.getElementById('details-name').textContent = table.name;
  document.getElementById('details-title').textContent = table.title;
  document.getElementById('details-note').textContent = table.note;
  // the status is news only when the schema marks changes at all
  const moduleName = MODULES.get(table.module).name;
  document.getElementById('details-meta').textContent = HAS_STATUS ? `${moduleName} · ${STATUS_NAME[table.status]}` : moduleName;
  const columns = document.getElementById('details-columns');
  columns.replaceChildren();
  for (const [name, type, flags, note, links] of table.columns) {
    const item = make('li', 'column');
    const head = make('div', 'column-head');
    head.append(make('span', flags & PK ? 'column-name key' : 'column-name', name), make('span', 'column-type', type));
    item.append(head);
    const marks = [flags & PK ? 'PK' : '', flags & FK ? 'FK' : '', flags & NULLABLE ? '' : TEXT.required].filter(Boolean);
    if (marks.length > 0) item.append(make('div', 'small muted', marks.join(' · ')));
    if (note) item.append(make('div', '', note));
    for (const [target, column] of links || []) item.append(tableLink(target, `→ ${target}.${column}`));
    columns.append(item);
  }
  const incoming = document.getElementById('details-incoming');
  incoming.replaceChildren();
  for (const source of table.incoming) {
    const button = listRow(make('button'), TABLES[source].name, moduleHint(TABLES[source].module, table.module));
    button.type = 'button';
    button.title = TABLES[source].title;
    button.addEventListener('click', () => goToTable(source));
    incoming.append(listItem(button));
  }
  document.getElementById('details-incoming-title').hidden = incoming.hidden = table.incoming.size === 0;
  document.getElementById('details-body').scrollTop = 0;
}
function goToTable(id) {                              // переход к таблице: в этой диаграмме, а если её тут нет — в обзоре
  if (!view.diagram.indexById.has(id)) switchDiagram(DATA.diagrams[0].code);
  showTable(view.diagram.indexById.get(id));
}
document.getElementById('details-close').addEventListener('click', () => select(-1));

// ---------- подсказка столбца ----------
// Появляется через TIP_DELAY_MS над одной строкой и стоит у карточки, а не бежит за курсором: при движении не мигает.
const tip = document.getElementById('tip');
let tipKey = '', tipTimer = 0;
function hideTip() {
  clearTimeout(tipTimer);
  tipKey = '';
  tip.hidden = true;
}
function rowAt(x, y, index) {                         // строка столбца карточки index под точкой окна — когда текст нарисован
  if (index < 0 || FONT.column * view.zoom < TEXT_MIN_PX) return null;
  const t = view.diagram.tables[index];
  const row = Math.floor(((y - view.ty) / view.zoom - t.y - CARD.head) / CARD.row);
  return row >= 0 && row < t.columns.length ? { index, row } : null;
}
function updateHoverRow(hit) {                        // строка под курсором: её связи подсвечиваются
  const old = view.hoverRow;
  if ((hit && old && hit.index === old.index && hit.row === old.row) || (!hit && !old)) return;
  view.hoverRow = hit;
  requestDraw();
}
function updateTip(hit) {
  const index = hit ? hit.index : -1, row = hit ? hit.row : -1;
  const t = hit ? view.diagram.tables[index] : null;
  const column = hit ? t.columns[row] : null;
  const key = column && column[3] ? index + ':' + row : '';
  if (key === tipKey) return;
  clearTimeout(tipTimer);
  tipKey = key;
  if (key === '') { tip.hidden = true; return; }
  const show = () => {
    document.getElementById('tip-name').textContent = column[0];
    document.getElementById('tip-note').textContent = column[3];
    tip.hidden = false;
    const left = t.x * view.zoom + view.tx, right = left + CARD.width * view.zoom;
    const rowTop = (t.y + CARD.head + row * CARD.row) * view.zoom + view.ty;
    let tipX = right + 8;                             // справа от карточки; не помещается — слева; иначе у края окна
    if (tipX + tip.offsetWidth > view.width - 8) tipX = left - 8 - tip.offsetWidth;
    tip.style.left = Math.max(8, Math.min(tipX, view.width - 8 - tip.offsetWidth)) + 'px';
    tip.style.top = Math.max(8, Math.min(rowTop, view.height - 8 - tip.offsetHeight)) + 'px';
  };
  if (tip.hidden) tipTimer = setTimeout(show, TIP_DELAY_MS); else show();
}

function hoverAt(x, y, index) {                       // строка под курсором: подсказка и подсветка её связей
  const hit = rowAt(x, y, index);
  updateTip(hit);
  updateHoverRow(hit);
}

// ---------- мышь и трекпад ----------
let drag = null;
canvas.addEventListener('pointerdown', (event) => {
  if (event.button !== 0) return;
  closeMenu();
  hideTip();
  canvas.setPointerCapture(event.pointerId);
  drag = { x: event.clientX, y: event.clientY, startX: event.clientX, startY: event.clientY, moved: false };
});
canvas.addEventListener('pointermove', (event) => {
  pointer.x = event.clientX; pointer.y = event.clientY; pointer.inside = true;
  if (drag) {
    if (!drag.moved && Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < CLICK_SLOP_PX) return;
    drag.moved = true;
    canvas.classList.add('panning');
    gesture();
    pan(event.clientX - drag.x, event.clientY - drag.y);
    drag.x = event.clientX; drag.y = event.clientY;
    return;
  }
  const over = tableAt(event.clientX, event.clientY);
  canvas.classList.toggle('over-table', over >= 0);
  if (over !== view.hover) { view.hover = over; requestDraw(); }
  if (!view.moving) hoverAt(event.clientX, event.clientY, over);
});
canvas.addEventListener('pointerup', (event) => {
  if (!drag) return;
  view.hover = tableAt(event.clientX, event.clientY);
  if (!drag.moved) select(view.hover);                // нажатие: выбрать таблицу или снять выбор
  requestDraw();
  drag = null;
  canvas.classList.remove('panning');
});
canvas.addEventListener('pointercancel', () => { drag = null; canvas.classList.remove('panning'); });
canvas.addEventListener('pointerleave', () => {
  pointer.inside = false;
  hideTip();
  updateHoverRow(null);
  if (view.hover !== -1) { view.hover = -1; requestDraw(); }
});
canvas.addEventListener('dblclick', (event) => {      // двойное нажатие — приблизить таблицу до читаемых столбцов
  const index = tableAt(event.clientX, event.clientY);
  if (index >= 0) showTable(index);
});
canvas.addEventListener('wheel', (event) => {
  event.preventDefault();
  pointer.x = event.clientX; pointer.y = event.clientY; pointer.inside = true;
  gesture();
  const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? view.height : 1;
  if (event.ctrlKey || event.metaKey) {               // щипок на трекпаде приходит с ctrlKey; Cmd и Ctrl с колесом — то же
    const delta = Math.max(-40, Math.min(40, event.deltaY * unit));   // колесо мыши даёт шаг 100 — ограничиваем
    zoomAt(event.clientX, event.clientY, Math.exp(-delta * 0.01));
  } else {
    pan(-event.deltaX * unit, -event.deltaY * unit);
  }
}, { passive: false });
let gestureZoom = 1;                                  // щипок в Safari
canvas.addEventListener('gesturestart', (event) => { event.preventDefault(); gestureZoom = view.zoom; });
canvas.addEventListener('gesturechange', (event) => {
  event.preventDefault();
  gesture();
  zoomAt(event.clientX, event.clientY, (gestureZoom * event.scale) / view.zoom);
});

document.getElementById('zoom-in').addEventListener('click', () => zoomAt(view.width / 2, view.height / 2, ZOOM_STEP));
document.getElementById('zoom-out').addEventListener('click', () => zoomAt(view.width / 2, view.height / 2, 1 / ZOOM_STEP));
document.getElementById('zoom-fit').addEventListener('click', fit);

// ---------- выбор диаграммы ----------
const menuButton = document.getElementById('menu-button');
const menu = document.getElementById('menu');
function setMenuOpen(button, list, open) {
  list.hidden = !open;
  button.setAttribute('aria-expanded', String(open));
}
function toggleMenu(button, list) {                   // открыть одно меню — значит закрыть остальные
  const open = list.hidden;
  closeMenu();
  setMenuOpen(button, list, open);
}
function closeMenu() {                                // закрывает все меню: диаграмм, статусов, столбцов
  setMenuOpen(menuButton, menu, false);
  statusPicker.close();
  modePicker.close();
}
menuButton.addEventListener('click', () => toggleMenu(menuButton, menu));
// Строка списка: название и, если нужно, серая подсказка справа — число или название модуля.
function listRow(element, label, secondary = null) {
  element.className = 'control';
  element.append(make('span', 'label', label));
  if (secondary !== null) element.append(make('span', 'secondary', String(secondary)));
  return element;
}
function listItem(node) {
  const item = make('li');
  item.append(node);
  return item;
}
// модуль называется словом, а не цветом, и только там, где он отличается от модуля вокруг (context)
const moduleHint = (module, context) => (module !== context ? MODULES.get(module).name : null);
function buildMenu() {
  for (const diagram of DATA.diagrams.filter((d) => d.mode === 'all')) {   // в меню — диаграммы, не их виды
    const link = listRow(make('a'), diagram.label);
    link.href = '#' + diagram.slug;
    link.dataset.code = diagram.code;
    link.addEventListener('click', (event) => {       // открываем сами: не везде нажатие на «#…» меняет адрес
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) return;
      event.preventDefault();
      switchDiagram(diagram.code);
    });
    menu.append(listItem(link));
  }
}
function switchDiagram(code) {                        // открыть диаграмму и записать её в адрес
  openDiagram(code);
  writeAddress(true);
}
function openDiagram(code) {
  // диаграмма в текущем виде столбцов; незнакомый адрес — первая диаграмма
  const diagram = DIAGRAMS.get(`${code}|${view.mode}`) || DIAGRAMS.get(`${DATA.diagrams[0].code}|${view.mode}`);
  code = diagram.code;
  closeMenu();
  if (view.diagram === diagram) return;
  prepare(diagram);
  view.diagram = diagram;
  view.hover = view.selected = -1;
  view.hoverRow = null;
  showDetails();
  hideTip();
  buildStatusMenu();
  document.title = diagram.name;
  document.getElementById('menu-label').textContent = diagram.label;
  for (const link of menu.querySelectorAll('a')) {
    if (link.dataset.code === code) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current');
  }
  search.value = '';
  showResults([]);
  fit();
}

// ---------- поиск таблицы ----------
const search = document.getElementById('search');
const results = document.getElementById('results');
let found = [];
const byName = new Intl.Collator();                   // порядок имён в результатах поиска
function showResults(list, query = '') {
  found = list;
  results.replaceChildren();
  results.hidden = list.length === 0 && query === '';
  if (list.length === 0 && query !== '') results.append(make('li', 'empty', TEXT.notFound));
  for (const index of list) {
    const t = view.diagram.tables[index];
    const button = listRow(make('button'), t.name, moduleHint(t.module, view.diagram.module));
    button.type = 'button';
    button.title = t.title;
    button.addEventListener('click', () => pick(index));
    results.append(listItem(button));
  }
}
function pick(index) {
  search.value = view.diagram.tables[index].name;
  showResults([]);
  showTable(index);
}
search.addEventListener('input', () => {
  const query = search.value.trim().toLowerCase();
  if (query === '') { showResults([]); return; }
  const tables = view.diagram.tables;
  const list = [];
  tables.forEach((t, i) => { if (t.search.includes(query)) list.push(i); });
  list.sort((a, b) => (tables[b].name.startsWith(query) - tables[a].name.startsWith(query))
    || byName.compare(tables[a].name, tables[b].name));
  showResults(list.slice(0, RESULTS_LIMIT), query);
});
search.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && found.length > 0) pick(found[0]);
  if (event.key === 'ArrowDown' && found.length > 0) { event.preventDefault(); results.querySelector('button').focus(); }
});
results.addEventListener('keydown', (event) => {      // стрелки ходят по найденным таблицам; вверх с первой — в поле
  if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
  event.preventDefault();
  const buttons = [...results.querySelectorAll('button')];
  const at = buttons.indexOf(document.activeElement) + (event.key === 'ArrowDown' ? 1 : -1);
  if (at < 0) search.focus(); else buttons[Math.min(at, buttons.length - 1)].focus();
});
document.addEventListener('keydown', (event) => {     // «/» и Cmd+K (Ctrl+K) — к поиску
  const typing = event.target instanceof HTMLInputElement;
  if ((event.key === '/' && !typing) || (event.key.toLowerCase() === 'k' && (event.metaKey || event.ctrlKey))) {
    event.preventDefault();
    search.focus();
    search.select();
  }
});
document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  closeMenu();
  search.value = '';
  showResults([]);
  select(-1);
});

// ---------- запуск ----------
function start() {
  DATA = JSON.parse(document.getElementById('diagram-data').textContent);
  applyStrings(DATA.lang);
  CARD = DATA.card;
  MODULES = new Map(DATA.modules.map((m) => [m.code, m]));
  DIAGRAMS = new Map(DATA.diagrams.map((d) => [`${d.code}|${d.mode}`, d]));
  DIAGRAMS_BY_SLUG = new Map(DATA.diagrams.filter((d) => d.mode === 'all').map((d) => [d.slug, d]));
  TABLES = DATA.tables;
  HAS_STATUS = Object.values(TABLES).some((table) => table.status !== 'same');
  for (const table of Object.values(TABLES)) table.incoming = new Set();
  for (const [id, table] of Object.entries(TABLES)) {  // кто ссылается на таблицу — из целей внешних ключей
    if (!MODULES.has(table.module) || !(table.status in STATUS_NAME)) throw new Error(`table ${id}: unknown module or status`);
    for (const column of table.columns) {
      for (const [target] of column[4] || []) {
        if (!TABLES[target]) throw new Error(`table ${id}: foreign key to unknown table ${target}`);
        if (target !== id) TABLES[target].incoming.add(id);
      }
    }
  }
  readTheme();
  buildMenu();
  buildModeMenu();
  resize();
  openAddress(location.hash.slice(1));
  window.addEventListener('resize', resize);
  window.addEventListener('hashchange', () => openAddress(location.hash.slice(1)));
  const refreshTheme = () => { readTheme(); requestDraw(); };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', refreshTheme);
  // a host theme switch (data-theme on the root element, as claude.ai artifacts do) repaints the canvas too
  new MutationObserver(refreshTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  window.__diagram = { view, draw, fit, pan, zoomAt, gesture, select, showTable, goToTable, openDiagram, openAddress, address, setMode, refreshTheme };   // для проверок из консоли
}
try {
  start();
} catch (error) {
  console.error(error);
  for (const id of ['diagram-panel', 'status-panel', 'mode-panel', 'minimap-panel', 'search-panel', 'zoom-panel', 'details', 'tip', 'canvas']) document.getElementById(id).hidden = true;
  document.getElementById('failure-text').textContent = TEXT.failure;
  document.getElementById('failure-reason').textContent = error && error.message ? error.message : String(error);
  document.getElementById('failure').hidden = false;
}
</script>
</body>
