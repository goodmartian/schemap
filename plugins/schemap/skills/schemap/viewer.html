<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Просмотрщик без своего каркаса <html>/<head>/<body> и без <title>: так его публикует claude.ai как артефакт
     (название даётся при публикации). Для файла перед ним ставится <!doctype html>, а схема дописывается в конец:
     <script id="schema" type="application/json">…</script>. Вид — по Linear: нейтральный фон, тонкие рамки, один шрифт без моноширного. */
  :root {
    --color-background: #f4f4f5;
    --color-surface: #ffffff;
    --color-panel: #ffffff;
    --color-border: #e2e2e5;
    --color-text: #1f2023;
    --color-text-muted: #6b6f76;
    --color-accent: #5e6ad2;
    --color-row-hover: #f0f0f2;
    --shadow-overlay: 0 4px 16px rgba(0, 0, 0, 0.08);
    --font: "Inter Variable", Inter, "SF Pro Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    /* скругления: 4 — внутри панели, 8 — панели и карточки, 12 — области; холст берёт эти же числа */
    --radius-inner: 4px;
    --radius-outer: 8px;
    --radius-area: 12px;
    --control-height: 32px;
    --icon-size: 16px;
    --key-width: 24px;                 /* колонка PK / FK у столбцов в панели описания */
    --search-width: 360px;             /* поиск: имя таблицы и её модуль без многоточия */
    --menu-width: 264px;
    --details-width: 360px;
    --tip-width: 320px;
    --minimap-width: 176px;
    --minimap-height: 112px;
    /* panels keep 12 from the window edge, plus the phone's safe area (notch, home bar) where there is one */
    --edge-top: calc(var(--space-3) + env(safe-area-inset-top, 0px));
    --edge-right: calc(var(--space-3) + env(safe-area-inset-right, 0px));
    --edge-bottom: calc(var(--space-3) + env(safe-area-inset-bottom, 0px));
    --edge-left: calc(var(--space-3) + env(safe-area-inset-left, 0px));
  }
  /* dark theme: from the system setting unless the host forces light; and again for a host that forces dark
     (claude.ai artifacts set data-theme on the root element) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-background: #0f1011;
      --color-surface: #161718;
      --color-panel: #191a1b;
      --color-border: #2a2c31;
      --color-text: #f7f8f8;
      --color-text-muted: #8a8f98;
      --color-accent: #7170ff;
      --color-row-hover: #232326;
      --shadow-overlay: 0 4px 16px rgba(0, 0, 0, 0.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --color-background: #0f1011;
    --color-surface: #161718;
    --color-panel: #191a1b;
    --color-border: #2a2c31;
    --color-text: #f7f8f8;
    --color-text-muted: #8a8f98;
    --color-accent: #7170ff;
    --color-row-hover: #232326;
    --shadow-overlay: 0 4px 16px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--color-background);
    color: var(--color-text);
    font: 13px/20px var(--font);
    -webkit-font-smoothing: antialiased;
  }
  /* главный холст — на всё окно; у мини-карты свой холст и свои правила */
  #canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #canvas.over-table { cursor: pointer; }
  #canvas.panning { cursor: grabbing; }
  #canvas.commenting { cursor: crosshair; }           /* режим комментариев claude.ai; правило ниже .over-table и главнее */
  .panel {
    position: fixed;
    padding: var(--space-1);
    background: var(--color-panel);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-outer);
    box-shadow: var(--shadow-overlay);                /* панели лежат поверх холста */
  }
  /* Панель инструментов — одна, как в Figma: меню диаграммы словом, остальное значками с подсказкой.
     Не шире схемы: длинное название диаграммы режется многоточием. */
  #toolbar {
    top: var(--edge-top); left: var(--edge-left); z-index: 1; display: flex; align-items: center; gap: var(--space-1);
    max-width: calc(100% - var(--edge-left) - var(--edge-right));
  }
  .tool { position: relative; flex: none; }
  #diagram-panel { flex: 0 1 auto; min-width: 0; max-width: var(--menu-width); }
  .divider { flex: none; width: 1px; height: var(--space-4); margin: 0 var(--space-1); background: var(--color-border); }
  /* Список всплывает под своей кнопкой поверх схемы и не меняет размер панели. */
  .popover {                                          /* вид — от .panel, здесь только место */
    position: absolute; top: calc(100% + var(--space-2)); left: calc(-1 * var(--space-1) - 1px);
    min-width: 100%; width: max-content; max-width: var(--menu-width); margin: 0;
  }
  #search-panel { width: var(--search-width); max-width: calc(100vw - 2 * var(--edge-left)); }
  #zoom-panel { right: var(--edge-right); bottom: var(--edge-bottom); display: flex; gap: var(--space-1); }
  #zoom-fit { min-width: var(--control-height); justify-content: center; font-variant-numeric: tabular-nums; }   /* масштаб в процентах; нажатие — весь вид */
  .control {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    height: var(--control-height);
    padding: 0 var(--space-2);
    border: 0;
    border-radius: var(--radius-inner);
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
  }
  /* Строка списка — на всю ширину и с подложкой под курсором. Кнопка на самой панели — по содержимому и меняет
     только цвет: панель с кнопками остаётся одним сплошным элементом. */
  li > .control, .trigger { width: 100%; }
  li > .control:hover, .control[aria-current] { background: var(--color-row-hover); }
  .square, #zoom-fit { color: var(--color-text-muted); }
  .control:hover, .control:hover .chevron { color: var(--color-text); }
  /* включённый вид (только ключи) и включённый фильтр — кнопка нажата, как инструмент в Figma */
  .square[aria-pressed="true"] { background: var(--color-row-hover); color: var(--color-text); }
  .control:focus-visible { outline: 2px solid var(--color-accent); outline-offset: -2px; }
  .square { width: var(--control-height); justify-content: center; padding: 0; }
  /* у поиска фокус показывает вся панель: поле внутри своей рамки не рисует */
  #search-panel:focus-within { border-color: var(--color-accent); box-shadow: 0 0 0 1px var(--color-accent), var(--shadow-overlay); }
  /* мини-карта: вся диаграмма и рамка окна; нажатие переносит туда вид */
  #minimap-panel { left: var(--edge-left); bottom: var(--edge-bottom); }
  @media (max-height: 559px) { #minimap-panel { display: none; } }   /* в низком окне она закрывала бы таблицы */
  #minimap { display: block; width: var(--minimap-width); height: var(--minimap-height); border-radius: var(--radius-inner); cursor: pointer; touch-action: none; }
  .icon { flex: none; width: var(--icon-size); height: var(--icon-size); }
  /* значки Lucide: сетка 24, линия 2, скруглённые концы */
  .icon, .chevron { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .search-row { display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-2); color: var(--color-text-muted); }
  .search-row input { padding-left: 0; color: var(--color-text); }
  .secondary {
    flex: none; max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--color-text-muted); font-variant-numeric: tabular-nums;
  }
  .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chevron { flex: none; width: var(--icon-size); height: var(--icon-size); color: var(--color-text-muted); }
  ul { margin: var(--space-1) 0 0; padding: 0; list-style: none; }
  input {
    width: 100%;
    height: var(--control-height);
    padding: 0 var(--space-2);
    border: 0;
    border-radius: var(--radius-inner);
    background: none;
    color: inherit;
    font: inherit;
    outline: none;                                    /* фокус показывает панель вокруг поля (:focus-within), не само поле */
  }
  input::placeholder { color: var(--color-text-muted); }
  input::-webkit-search-cancel-button { display: none; }   /* поле очищает Esc; свой крестик браузера выбивается из вида */
  .empty { margin: 0; padding: 0 var(--space-2); line-height: var(--control-height); color: var(--color-text-muted); }
  /* Панель описания таблицы — боковая колонка, как свойства задачи в Linear: занимает правый край на всю высоту
     и сдвигает схему, а не ложится поверх неё. Масштаб уходит влево от колонки. В узком окне — снизу. */
  #details {
    top: 0;
    right: 0;
    bottom: 0;
    width: var(--details-width);
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) 0;
    border: 0;
    border-left: 1px solid var(--color-border);
    border-radius: 0;
    box-shadow: none;
  }
  @media (min-width: 720px) {
    /* открыта ли колонка — CSS читает с самой колонки (атрибут hidden), отдельного флага нет.
       У холста своя ширина в пикселях: «auto» её не растягивает, поэтому ширина задана явно. */
    body:has(#details:not([hidden])) #canvas { width: calc(100% - var(--details-width)); }
    body:has(#details:not([hidden])) #zoom-panel { right: calc(var(--details-width) + var(--space-3)); }
    body:has(#details:not([hidden])) #toolbar { max-width: calc(100% - var(--edge-left) - var(--details-width) - var(--space-3)); }
  }
  @media (max-width: 719px) {
    #details {
      top: auto; left: var(--edge-left); right: var(--edge-right); bottom: var(--edge-bottom); width: auto; max-height: 50%;
      padding: 0; border: 1px solid var(--color-border); border-radius: var(--radius-outer); box-shadow: var(--shadow-overlay);
    }
    #minimap-panel { display: none; }                  /* на телефоне мини-карте нет места рядом с описанием */
  }
  #details-top { flex: none; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-1) var(--space-1) var(--space-4); }
  #details-top .square { flex: none; }
  #details-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--space-4) var(--space-3); overflow-wrap: anywhere; }
  h2 { flex: 1; min-width: 0; margin: 0; font-size: 15px; line-height: 24px; font-weight: 600; overflow-wrap: anywhere; }
  h3 { margin: var(--space-4) 0 var(--space-1); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--color-text-muted); }
  #details p { margin: 0; }
  #details ul { margin: 0; }
  #details-note { color: var(--color-text-muted); }
  .meta { margin-top: var(--space-1); font-size: 12px; line-height: 16px; color: var(--color-text-muted); }
  /* Столбец — одна строка, как свойство в Linear: ключ, имя, тип; под ними описание и куда ссылается.
     «?» после типа — столбец может быть пустым, как на схеме. */
  .column {
    display: grid; grid-template-columns: var(--key-width) minmax(0, 1fr) auto; column-gap: var(--space-2);
    align-items: baseline; padding: var(--space-1) 0;
  }
  .column-key { font-size: 12px; font-weight: 600; color: var(--color-text-muted); }
  .column-name { min-width: 0; font-weight: 500; }
  .column-name.key { font-weight: 600; }
  .column-type { font-size: 12px; color: var(--color-text-muted); text-align: right; }
  .column-note, .column .link { grid-column: 2 / -1; font-size: 12px; line-height: 16px; }
  .column-note { color: var(--color-text-muted); }
  .link {
    display: block;
    padding: 0;
    border: 0;
    background: none;
    color: var(--color-accent);
    font: inherit;
    text-align: left;
    overflow-wrap: anywhere;
    cursor: pointer;
  }
  .link:hover { text-decoration: underline; }
  .link:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  #details #details-incoming { margin: 0 calc(-1 * var(--space-2)); }   /* подсветка строк выходит за поле; «#details ul» иначе главнее */
  #details-incoming .control { padding-left: calc(var(--key-width) + 2 * var(--space-2)); }   /* имена — на линии имён столбцов */
  /* подсказка столбца на холсте */
  #tip {
    position: fixed;
    max-width: var(--tip-width);
    padding: var(--space-2) var(--space-3);
    background: var(--color-panel);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-outer);
    box-shadow: var(--shadow-overlay);
    overflow-wrap: anywhere;
    pointer-events: none;
  }
  #tip-name { font-weight: 600; }
  #failure { position: fixed; inset: 0; display: grid; place-content: center; gap: var(--space-1); margin: 0; padding: var(--space-4); text-align: center; }
  #failure-reason { color: var(--color-text-muted); white-space: pre-line; }   /* каждая проблема схемы — своей строкой */
</style>

<script id="schemap-core">
'use strict';
/*
 * schemap core: schema.json → checked, laid-out diagrams. No page access here, so the same code runs in the
 * viewer and in check.mjs (Node). layoutSchema(raw) returns { data, summary } or throws SchemaError / Error
 * with every problem it found. Layout: same-width columns of cards, the next card in the shortest column;
 * one area per module; each diagram in two views (all columns; keys only).
 */
const LAYOUT = {
  cardW: 260, cardHead: 48, row: 24,           // 4-point scale: 8 + name 16 + title 16 + 8; a row is 24
  gapX: 64, gapY: 32,                          // between card columns: room for reference lines
  areaPad: 24, areaTop: 48, areaGap: 128,      // area name: 12 + label 24 + 12; between areas
  viewAspect: 1440 / 744, maxRows: 4, maxTarget: 9000,
};
// module colour for a dark and for a light background; neighbouring areas get distant hues
const PALETTE = [
  ['#8eb7ff', '#2563eb'], ['#ff9f74', '#c2410c'], ['#8a61f5', '#6d28d9'],
  ['#c05dcf', '#a21caf'], ['#ffe374', '#a16207'], ['#42e0c0', '#0f766e'],
  ['#9ef07a', '#4d7c0f'], ['#ff6363', '#dc2626'], ['#4dee8a', '#15803d'],
  ['#7dd3fc', '#0369a1'], ['#fda4af', '#be123c'], ['#cbd5e1', '#475569'],
];
const NEIGHBOUR_HUE_MIN = 45;
const FLAG = { PK: 1, FK: 2, NULLABLE: 4 };
const MODES = ['all', 'keys'];
const SCHEMA_STATUSES = ['new', 'changed', 'same'];
const SCHEMA_LANGS = ['en', 'ru'];
const WORDS = { en: { overview: 'Overview', database: 'Database' }, ru: { overview: 'Обзор', database: 'База' } };
// address slugs: ASCII letters, digits, single hyphens — the only #name a claude.ai artifact link carries;
// claude.ai reserves these names for itself
const RESERVED_SLUGS = new Set(['settings', 'sidebar', 'customize', 'upgrade', 'downloads']);

class SchemaError extends Error {}

// ---------- input format: optional fields get their documented defaults here, in one place ----------
function checkSchema(raw) {
  const problems = [];
  const need = (condition, message) => { if (!condition) problems.push(message); return Boolean(condition); };
  const isText = (value) => typeof value === 'string' && value !== '';
  const isObject = (value) => value !== null && typeof value === 'object' && !Array.isArray(value);
  if (!isObject(raw)) throw new SchemaError('the schema must be a JSON object');
  const lang = raw.lang ?? 'en';
  need(SCHEMA_LANGS.includes(lang), `"lang" must be one of ${SCHEMA_LANGS.join(', ')}, got ${JSON.stringify(lang)}`);
  const tables = raw.tables;
  if (!need(Array.isArray(tables) && tables.length > 0, '"tables" must be a non-empty list')) {
    throw new SchemaError(problems.join('\n'));
  }
  const refs = raw.refs ?? [];
  need(Array.isArray(refs), '"refs" must be a list');

  const seen = new Set(), clean = [];
  tables.forEach((t, n) => {
    if (!need(isObject(t), `tables[${n}]: must be an object`)) return;
    need(isText(t.id), `tables[${n}]: "id" must be a non-empty string`);
    const where = `table ${t.id}`;
    need(!seen.has(t.id), `${where}: duplicate id`);
    seen.add(t.id);
    need(isText(t.name), `${where}: "name" must be a non-empty string`);
    need(isText(t.module), `${where}: "module" must be a non-empty string`);
    const status = t.status ?? 'same';
    need(SCHEMA_STATUSES.includes(status), `${where}: "status" must be one of ${SCHEMA_STATUSES.join(', ')}, got ${JSON.stringify(status)}`);
    if (!need(Array.isArray(t.columns) && t.columns.length > 0, `${where}: "columns" must be a non-empty list`)) return;
    const names = new Set(), columns = [];
    for (const c of t.columns) {
      if (!need(isObject(c) && isText(c.name), `${where}: every column needs a "name"`)) continue;
      need(!names.has(c.name), `${where}: duplicate column ${c.name}`);
      names.add(c.name);
      need(isText(c.type), `${where}.${c.name}: "type" must be a non-empty string`);
      const pk = c.pk ?? false, nullable = c.nullable ?? true;
      need(typeof pk === 'boolean' && typeof nullable === 'boolean', `${where}.${c.name}: "pk" and "nullable" must be true or false`);
      columns.push({ name: c.name, type: c.type || '', pk, nullable, note: c.note || '' });
    }
    clean.push({ id: t.id, name: t.name, module: t.module, status, title: t.title || '', note: t.note || '', columns });
  });

  const byId = new Map(clean.map((t) => [t.id, t]));
  const cleanRefs = [], refKeys = new Set();
  let duplicates = 0;
  (Array.isArray(refs) ? refs : []).forEach((r, n) => {
    const where = `refs[${n}]`;
    const ends = ['from', 'to'].map((side) => r && r[side]);
    if (!need(ends.every((end) => isObject(end) && Array.isArray(end.columns)),
      `${where}: needs "from" and "to", each with "table" and "columns"`)) return;
    let ok = true;
    for (const { table, columns } of ends) {
      if (!need(byId.has(table), `${where}: unknown table ${table}`)) { ok = false; continue; }
      const have = new Set(byId.get(table).columns.map((c) => c.name));
      for (const col of columns) ok = need(have.has(col), `${where}: table ${table} has no column ${col}`) && ok;
    }
    ok = need(ends[0].columns.length === ends[1].columns.length && ends[0].columns.length > 0,
      `${where}: "from" and "to" need the same non-zero number of columns`) && ok;
    if (!ok) return;
    const ref = { from: { table: ends[0].table, columns: [...ends[0].columns] }, to: { table: ends[1].table, columns: [...ends[1].columns] } };
    const key = JSON.stringify(ref);
    if (refKeys.has(key)) duplicates++;
    refKeys.add(key);
    cleanRefs.push(ref);
  });
  need(duplicates === 0, `${duplicates} duplicate references`);

  const used = [...new Set(clean.map((t) => t.module))];
  let modules = raw.modules;
  if (modules === undefined || modules === null) {
    modules = [...used].sort().map((code) => ({ code, name: code }));
  } else if (need(Array.isArray(modules), '"modules" must be a list')) {
    const codes = modules.filter(isObject).map((m) => m.code);
    need(codes.length === modules.length && codes.every(isText), 'every module needs a "code"');
    need(new Set(codes).size === codes.length, 'duplicate module codes');
    const missing = used.filter((code) => !codes.includes(code));
    need(missing.length === 0, `tables use modules that "modules" does not list: ${missing.join(', ')}`);
    const unused = codes.filter((code) => !used.includes(code));
    need(unused.length === 0, `modules without tables: ${unused.join(', ')}`);
    modules = modules.filter(isObject).map((m) => ({ code: m.code, name: m.name || m.code }));
  }
  if (problems.length > 0) throw new SchemaError(problems.join('\n'));
  return { title: raw.title || WORDS[lang].database, lang, modules, tables: clean, refs: cleanRefs };
}

function slugger(fallback) {                       // a unique address slug for each text
  const taken = new Set();
  return (text) => {
    let base = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || `${fallback}-${taken.size + 1}`;
    if (RESERVED_SLUGS.has(base) || base.startsWith('comment-')) base = `${fallback}-${base}`;
    let candidate = base;
    for (let n = 2; taken.has(candidate); n++) candidate = `${base}-${n}`;
    taken.add(candidate);
    return candidate;
  };
}

// ---------- layout ----------
const cardHeight = (count) => LAYOUT.cardHead + LAYOUT.row * count;
function rectsIntersect(a, b, gap = 0) {          // two {x, y, w, h} rectangles overlap, or come closer than gap
  return a.x < b.x + b.w + gap && a.x + a.w + gap > b.x && a.y < b.y + b.h + gap && a.y + a.h + gap > b.y;
}
function hueOf(color) {
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(color.slice(i, i + 2), 16) / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  if (d === 0) return 0;
  const h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return ((h * 60) + 360) % 360;
}
const PALETTE_HUE = new Map(PALETTE.map((pair) => [pair, hueOf(pair[0])]));
function hueDistance(a, b) {
  const d = Math.abs(PALETTE_HUE.get(a) - PALETTE_HUE.get(b));
  return Math.min(d, 360 - d);
}
// A colour per module such that neighbouring areas on the overview differ in hue: backtracking, the module with
// most neighbours first. Colours are unique while there are enough of them; past that, only neighbours differ.
function assignColors(codes, rects) {
  const neighbours = new Map(codes.map((c) => [c, codes.filter((o) => o !== c && rectsIntersect(rects[c], rects[o], LAYOUT.areaGap + 1))]));
  const order = [...codes].sort((a, b) => neighbours.get(b).length - neighbours.get(a).length);
  const unique = codes.length <= PALETTE.length;
  const chosen = new Map();
  const place = (i) => {
    if (i === order.length) return true;
    const code = order[i];
    const taken = new Set(chosen.values());
    for (const pair of PALETTE) {
      if (unique && taken.has(pair)) continue;
      if (neighbours.get(code).every((o) => !chosen.has(o) || hueDistance(pair, chosen.get(o)) >= NEIGHBOUR_HUE_MIN)) {
        chosen.set(code, pair);
        if (place(i + 1)) return true;
        chosen.delete(code);
      }
    }
    return false;
  };
  if (!place(0)) throw new Error('could not colour the modules so that neighbouring areas differ in hue');
  return chosen;
}
function columnCount(items, target) {              // card columns so that none is taller than target
  const total = items.reduce((sum, [, h]) => sum + h, 0) + LAYOUT.gapY * (items.length - 1);
  return Math.min(items.length, Math.max(1, Math.ceil(total / target)));
}
function pack(items, columns) {                    // items: [[id, height]] → area size and card places
  const filled = new Array(columns).fill(0), places = [];
  for (const [id, h] of items) {
    let col = 0;
    for (let i = 1; i < columns; i++) if (filled[i] < filled[col]) col = i;
    places.push([id, col * (LAYOUT.cardW + LAYOUT.gapX), filled[col]]);
    filled[col] += h + LAYOUT.gapY;
  }
  return { w: columns * LAYOUT.cardW + (columns - 1) * LAYOUT.gapX + 2 * LAYOUT.areaPad,
    h: Math.max(...filled) - LAYOUT.gapY + LAYOUT.areaTop + LAYOUT.areaPad, places };
}
// first closeness to the window proportions (coarse), then the smallest area
const aspectScore = (w, h) => [Math.round(Math.abs(Math.log((w / h) / LAYOUT.viewAspect)) * 10) / 10, w * h];
const better = (a, b) => b === null || a[0] < b[0] || (a[0] === b[0] && a[1] < b[1]);
function targets(heights) {                        // column heights to try, every 100: tallest card … one column
  const tallest = Math.max(...heights);
  const total = heights.reduce((s, h) => s + h, 0) + LAYOUT.gapY * heights.length;
  const out = [];
  for (let t = tallest; t <= Math.max(tallest, Math.min(total, LAYOUT.maxTarget)); t += 100) out.push(t);
  return out;
}
function* combinations(values, k, start = 0, picked = []) {
  if (picked.length === k) { yield picked; return; }
  for (let i = start; i < values.length; i++) yield* combinations(values, k, i + 1, [...picked, values[i]]);
}
function layoutOverview(codes, itemsByModule) {
  const heights = codes.flatMap((c) => itemsByModule[c].map(([, h]) => h));
  const packs = new Map();                         // a packing depends only on the column count: keep each once
  let best = null;
  const cutPoints = codes.map((_, i) => i).slice(1);
  for (const target of targets(heights)) {
    const packed = {};
    for (const c of codes) {
      const key = `${c}|${columnCount(itemsByModule[c], target)}`;
      if (!packs.has(key)) packs.set(key, pack(itemsByModule[c], columnCount(itemsByModule[c], target)));
      packed[c] = packs.get(key);
    }
    // 1–3 modules fit one row; from 4 on, one row makes tall narrow areas whose names get cut
    for (let rows = codes.length <= 3 ? 1 : 2; rows <= Math.min(codes.length, LAYOUT.maxRows); rows++) {
      for (const cuts of combinations(cutPoints, rows - 1)) {
        const bounds = [0, ...cuts, codes.length];
        const groups = bounds.slice(1).map((end, i) => codes.slice(bounds[i], end));
        const widths = groups.map((g) => g.reduce((s, c) => s + packed[c].w, 0) + LAYOUT.areaGap * (g.length - 1));
        const rowHeights = groups.map((g) => Math.max(...g.map((c) => packed[c].h)));
        const score = aspectScore(Math.max(...widths), rowHeights.reduce((s, h) => s + h, 0) + LAYOUT.areaGap * (rows - 1));
        if (better(score, best && best.score)) best = { score, packed, groups, rowHeights };
      }
    }
  }
  const areas = {}, positions = {};
  let y = 0;
  best.groups.forEach((group, row) => {
    let x = 0;
    for (const code of group) {
      const p = best.packed[code];
      areas[code] = { x, y, w: p.w, h: best.rowHeights[row] };
      for (const [id, dx, dy] of p.places) positions[id] = [x + LAYOUT.areaPad + dx, y + LAYOUT.areaTop + dy];
      x += p.w + LAYOUT.areaGap;
    }
    y += best.rowHeights[row] + LAYOUT.areaGap;
  });
  return { areas, positions };
}
// own: [[id, height]] of the module; otherGroups: [[module code, [[id, height]]]] — tables of other modules it
// references, one area per module. Those areas stack in columns to the right, no taller than the module's own area.
function layoutModule(own, otherGroups) {
  const heights = [...own.map(([, h]) => h), ...otherGroups.flatMap(([, items]) => items.map(([, h]) => h))];
  let best = null;
  for (const target of targets(heights)) {
    const a = pack(own, columnCount(own, target));
    const columns = [];
    let column = null;
    for (const [code, items] of otherGroups) {
      const p = pack(items, columnCount(items, Math.max(a.h - LAYOUT.areaTop - LAYOUT.areaPad, ...items.map(([, h]) => h))));
      if (column === null || (column.items.length > 0 && column.h + LAYOUT.areaGap + p.h > a.h)) {
        column = { w: 0, h: -LAYOUT.areaGap, items: [] };
        columns.push(column);
      }
      column.items.push([code, p, column.h + LAYOUT.areaGap]);
      column.h += LAYOUT.areaGap + p.h;
      column.w = Math.max(column.w, p.w);
    }
    const w = a.w + columns.reduce((s, c) => s + LAYOUT.areaGap + c.w, 0);
    const h = Math.max(a.h, ...columns.map((c) => c.h));
    const score = aspectScore(w, h);
    if (better(score, best && best.score)) best = { score, a, columns, h };
  }
  const { a, columns, h } = best;
  const areas = { own: { x: 0, y: 0, w: a.w, h } };
  const positions = {};
  for (const [id, dx, dy] of a.places) positions[id] = [LAYOUT.areaPad + dx, LAYOUT.areaTop + dy];
  let x = a.w;
  for (const column of columns) {
    x += LAYOUT.areaGap;
    for (const [code, p, y] of column.items) {
      areas[code] = { x, y, w: p.w, h: p.h };
      for (const [id, dx, dy] of p.places) positions[id] = [x + LAYOUT.areaPad + dx, y + LAYOUT.areaTop + dy];
    }
    x += column.w;
  }
  return { areas, positions };
}

// One diagram: areas, cards (columns shown on each), references between card rows; check() proves the geometry.
class DiagramBuilder {
  constructor(code, mode, slug, name, label, module) {
    this.data = { code, mode, slug, name, label, module, areas: [], tables: [], refs: [] };
    this.tableIndex = new Map(); this.columnIndex = new Map(); this.tableArea = []; this.rows = 0;
  }
  addArea(name, rect, module) {
    this.data.areas.push({ name, module, ...rect, count: 0 });
    return this.data.areas.length - 1;
  }
  addTable(t, shown, [x, y], area) {             // shown: names of the columns that go on the card
    const indexes = t.columns.map((c, i) => (shown.has(c.name) ? i : -1)).filter((i) => i >= 0);
    this.tableIndex.set(t.id, this.data.tables.length);
    this.columnIndex.set(t.id, new Map(indexes.map((i, n) => [t.columns[i].name, n])));
    this.tableArea.push(area);
    this.data.areas[area].count++;
    this.rows += indexes.length;
    const entry = { id: t.id, x, y, h: cardHeight(indexes.length) };
    if (indexes.length < t.columns.length) entry.cols = indexes;   // short card: indexes of the shown columns
    this.data.tables.push(entry);
  }
  addRef({ from, to }) {
    this.data.refs.push([this.tableIndex.get(from.table), this.columnIndex.get(from.table).get(from.columns[0]),
      this.tableIndex.get(to.table), this.columnIndex.get(to.table).get(to.columns[0])]);
  }
  check(expectTables, expectRefs, expectAreas) {
    const d = this.data;
    const got = [d.tables.length, d.refs.length, d.areas.length];
    if (got.join() !== [expectTables, expectRefs, expectAreas].join()) {
      throw new Error(`${d.name}: tables, references, areas ${got.join(', ')}, expected ${[expectTables, expectRefs, expectAreas].join(', ')}`);
    }
    const cards = d.tables.map((t) => ({ x: t.x, y: t.y, w: LAYOUT.cardW, h: t.h, id: t.id }));
    let overlaps = 0;
    for (let i = 0; i < cards.length; i++) for (let j = i + 1; j < cards.length; j++) if (rectsIntersect(cards[i], cards[j])) overlaps++;
    if (overlaps) throw new Error(`${d.name}: ${overlaps} pairs of cards overlap`);
    cards.forEach((card, n) => {
      const holders = d.areas.map((a, i) => (card.x >= a.x && card.y >= a.y && card.x + card.w <= a.x + a.w
        && card.y + card.h <= a.y + a.h ? i : -1)).filter((i) => i >= 0);
      if (holders.length !== 1 || holders[0] !== this.tableArea[n]) throw new Error(`${d.name}: table ${card.id} is outside its area`);
    });
    for (let i = 0; i < d.areas.length; i++) for (let j = i + 1; j < d.areas.length; j++) {
      if (rectsIntersect(d.areas[i], d.areas[j])) throw new Error(`${d.name}: areas overlap: ${d.areas[i].name} and ${d.areas[j].name}`);
    }
    d.size = [Math.max(...d.areas.map((a) => a.x + a.w)), Math.max(...d.areas.map((a) => a.y + a.h))];
    return `${d.name} [${d.mode}]: ${got[0]} tables, ${this.rows} column rows, ${got[1]} references, ${got[2]} areas, ${d.size[0]}×${d.size[1]}`;
  }
}

function layoutSchema(raw) {
  const schema = checkSchema(raw);
  const words = WORDS[schema.lang];
  const { title, modules, tables, refs } = schema;
  const codes = modules.map((m) => m.code);
  const moduleName = new Map(modules.map((m) => [m.code, m.name]));
  const byId = new Map(tables.map((t) => [t.id, t]));
  const columnsTotal = tables.reduce((s, t) => s + t.columns.length, 0);
  const referenced = new Map(), fkColumns = new Map(tables.map((t) => [t.id, new Set()]));
  for (const r of refs) {
    referenced.set(r.to.table, (referenced.get(r.to.table) || 0) + 1);
    for (const c of r.from.columns) fkColumns.get(r.from.table).add(c);
  }
  const byName = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
  // most referenced tables first: they land at the top of their area
  const byModule = Object.fromEntries(codes.map((c) => [c, tables.filter((t) => t.module === c)
    .sort((a, b) => (referenced.get(b.id) || 0) - (referenced.get(a.id) || 0) || byName(a.name, b.name))]));
  // keys view: primary key and both ends of every reference
  const keys = new Map(tables.map((t) => [t.id, new Set(t.columns.filter((c) => c.pk).map((c) => c.name))]));
  for (const r of refs) for (const end of [r.from, r.to]) for (const c of end.columns) keys.get(end.table).add(c);
  const keysTotal = [...keys.values()].reduce((s, k) => s + k.size, 0);
  const diagramSlug = slugger('diagram'), tableSlug = slugger('table');
  const slugs = Object.fromEntries(['overview', ...codes].map((c) => [c, diagramSlug(c)]));
  const diagrams = [], summary = [];
  let colors = null, inner = 0, outer = 0;
  for (const mode of MODES) {
    const shown = (t) => (mode === 'all' ? new Set(t.columns.map((c) => c.name)) : keys.get(t.id));
    let d = new DiagramBuilder('overview', mode, slugs.overview, `${title} — ${words.overview.toLowerCase()}`, words.overview, null);
    const overview = layoutOverview(codes, Object.fromEntries(codes.map((c) => [c, byModule[c].map((t) => [t.id, cardHeight(shown(t).size)])])));
    if (mode === 'all') colors = assignColors(codes, overview.areas);   // the same colours in both views
    const areaOf = Object.fromEntries(codes.map((c) => [c, d.addArea(moduleName.get(c), overview.areas[c], c)]));
    for (const t of tables) d.addTable(t, shown(t), overview.positions[t.id], areaOf[t.module]);
    for (const r of refs) d.addRef(r);
    summary.push(d.check(tables.length, refs.length, codes.length));
    if (d.rows !== (mode === 'all' ? columnsTotal : keysTotal)) throw new Error(`overview (${mode}): column rows differ from the schema`);
    diagrams.push(d.data);

    for (const code of codes.length > 1 ? codes : []) {
      d = new DiagramBuilder(code, mode, slugs[code], `${title} — ${moduleName.get(code)}`, moduleName.get(code), code);
      const own = byModule[code];
      const ownIds = new Set(own.map((t) => t.id));
      const touching = refs.filter((r) => ownIds.has(r.from.table) || ownIds.has(r.to.table));
      if (mode === 'all') {
        const within = touching.filter((r) => ownIds.has(r.from.table) && ownIds.has(r.to.table)).length;
        inner += within;
        outer += touching.length - within;
      }
      const otherColumns = new Map();
      for (const r of touching) for (const end of [r.from, r.to]) {
        if (ownIds.has(end.table)) continue;
        if (!otherColumns.has(end.table)) otherColumns.set(end.table, new Set());
        for (const c of end.columns) otherColumns.get(end.table).add(c);
      }
      const others = [...otherColumns.keys()].map((id) => byId.get(id))
        .sort((a, b) => codes.indexOf(a.module) - codes.indexOf(b.module) || byName(a.name, b.name));
      const otherCodes = codes.filter((c) => others.some((t) => t.module === c));
      const layout = layoutModule(own.map((t) => [t.id, cardHeight(shown(t).size)]),
        otherCodes.map((c) => [c, others.filter((t) => t.module === c).map((t) => [t.id, cardHeight(otherColumns.get(t.id).size)])]));
      const ownArea = d.addArea(moduleName.get(code), layout.areas.own, code);
      for (const t of own) d.addTable(t, shown(t), layout.positions[t.id], ownArea);
      const otherArea = Object.fromEntries(otherCodes.map((c) => [c, d.addArea(moduleName.get(c), layout.areas[c], c)]));
      for (const t of others) d.addTable(t, otherColumns.get(t.id), layout.positions[t.id], otherArea[t.module]);
      for (const r of touching) d.addRef(r);
      summary.push(d.check(own.length + others.length, touching.length, 1 + otherCodes.length));
      diagrams.push(d.data);
    }
  }
  if (codes.length > 1 && (inner + Math.floor(outer / 2) !== refs.length || outer % 2)) {
    throw new Error(`references by module do not add up: inside ${inner}, outward ${outer}`);
  }
  // shared table list: columns with notes and foreign-key targets; diagrams point into it by id
  const linkTargets = new Map();
  for (const r of refs) r.from.columns.forEach((column, i) => {
    const key = `${r.from.table}\u0000${column}`;
    if (!linkTargets.has(key)) linkTargets.set(key, []);
    const links = linkTargets.get(key);
    if (!links.some(([t, c]) => t === r.to.table && c === r.to.columns[i])) links.push([r.to.table, r.to.columns[i]]);
  });
  const registry = {};
  let notes = 0;
  for (const t of tables) {
    const columns = t.columns.map((c) => {
      const item = [c.name, c.type, (c.pk ? FLAG.PK : 0) | (fkColumns.get(t.id).has(c.name) ? FLAG.FK : 0) | (c.nullable ? FLAG.NULLABLE : 0), c.note];
      if (c.note) notes++;
      const links = linkTargets.get(`${t.id}\u0000${c.name}`);
      if (links) item.push(links);
      return item;
    });
    registry[t.id] = { name: t.name, slug: tableSlug(t.id), module: t.module, status: t.status, title: t.title, note: t.note, columns };
  }
  const data = {
    lang: schema.lang,
    card: { width: LAYOUT.cardW, head: LAYOUT.cardHead, row: LAYOUT.row, areaTop: LAYOUT.areaTop, areaPad: LAYOUT.areaPad, areaGap: LAYOUT.areaGap },
    modules: codes.map((c) => ({ code: c, name: moduleName.get(c), dark: colors.get(c)[0], light: colors.get(c)[1] })),
    tables: registry, diagrams,
  };
  summary.push(`column notes: ${notes} of ${columnsTotal}`,
    `tables ${tables.length}, columns ${columnsTotal}, references ${refs.length}, modules ${codes.length}`);
  if (codes.length > 1) summary.push(`references inside modules ${inner}, between modules ${Math.floor(outer / 2)}`);
  summary.push('cards overlap: 0; every table inside its area; areas do not overlap');
  return { data, summary, schema };   // schema: checked, with defaults — what the exports take
}

// ---------- export: the checked schema (layoutSchema's `schema`) as DBML and as SQL; the importers read both back ----------
// Both formats have no field for a table's title or status: the title goes into the table note, the status is left out.
const tableNote = (t) => [t.title, t.note].filter(Boolean).join(' — ');
const keyColumns = (t) => t.columns.filter((c) => c.pk);
// "schema.name" when the id is that, otherwise the bare name; each part quoted the format's way
function tableRef(t, quote) {
  const dot = t.id.lastIndexOf('.');
  return (dot > 0 && t.id.slice(dot + 1) === t.name ? [t.id.slice(0, dot), t.name] : [t.name]).map(quote).join('.');
}

// DBML has no way to write a double quote inside a quoted name: such a name stops the export with its own words
const dbmlQuoted = (plain) => (text) => {
  if (plain.test(text)) return text;

const SQL_RESERVED = new Set(('all analyse analyze and any array as asc asymmetric both case cast check collate column '
  + 'constraint create current_catalog current_date current_role current_time current_timestamp current_user default '
  + 'deferrable desc distinct do else end except false fetch for foreign from grant group having in initially '
  + 'intersect into lateral leading limit localtime localtimestamp not null offset on only or order placing primary '
  + 'references returning select session_user some symmetric table then to trailing true union unique user using '
  + 'variadic when where window with').split(' '));

  + 'bigserial decimal numeric real float float4 float8 double precision money text varchar character varying char '
  + 'character bpchar bytea boolean bool date time timetz timestamp timestamptz with without zone interval uuid json '
  + 'jsonb xml inet cidr macaddr macaddr8 point line lseg box path polygon circle tsvector tsquery bit varbit '
  + 'int4range int8range numrange tsrange tstzrange daterange int4multirange int8multirange nummultirange '
  + 'tsmultirange tstzmultirange datemultirange oid name').split(' '));

function schemaToSql(schema) {
  const byId = new Map(schema.tables.map((t) => [t.id, t]));
  const ref = (id) => tableRef(byId.get(id), sqlName);
  const columnList = (columns) => columns.map(sqlName).join(', ');
  const out = [];
  const ownTypes = [...new Set(schema.tables.flatMap((t) => t.columns.map((c) => c.type)))].filter((type) => !isPostgresType(type));
  if (ownTypes.length) out.push(`-- Types not built into Postgres (enums, domains, extension types); they must exist before this script runs: ${ownTypes.sort().join(', ')}`, '');
  const schemas = new Set(schema.tables.map((t) => tableRef(t, (part) => part)).filter((name) => name.includes('.')).map((name) => name.slice(0, name.lastIndexOf('.'))));
  for (const s of schemas) out.push(`CREATE SCHEMA IF NOT EXISTS ${sqlName(s)};`);
  for (const t of schema.tables) {
    const keys = keyColumns(t).map((c) => c.name);
    const lines = t.columns.map((c) => `  ${sqlName(c.name)} ${c.type}${c.nullable ? '' : ' NOT NULL'}`);
    if (keys.length) lines.push(`  PRIMARY KEY (${columnList(keys)})`);
    out.push('', `CREATE TABLE ${ref(t.id)} (`, lines.join(',\n'), ');');
    if (tableNote(t)) out.push(`COMMENT ON TABLE ${ref(t.id)} IS ${sqlString(tableNote(t))};`);
    for (const c of t.columns) if (c.note) out.push(`COMMENT ON COLUMN ${ref(t.id)}.${sqlName(c.name)} IS ${sqlString(c.note)};`);
  }
  if (schema.refs.length) out.push('');
  // a reference proves its target unique; one that is not the primary key needs that said for Postgres to accept it
  const unique = new Set();
  for (const r of schema.refs) {
    const keys = keyColumns(byId.get(r.to.table)).map((c) => c.name);
    const isKey = keys.length === r.to.columns.length && keys.every((k) => r.to.columns.includes(k));
    if (!isKey) unique.add(`ALTER TABLE ${ref(r.to.table)} ADD UNIQUE (${columnList(r.to.columns)});`);
  }
  out.push(...unique);
  for (const r of schema.refs) {
    out.push(`ALTER TABLE ${ref(r.from.table)} ADD FOREIGN KEY (${columnList(r.from.columns)}) REFERENCES ${ref(r.to.table)} (${columnList(r.to.columns)});`);
  }
  return out.join('\n') + '\n';
}
